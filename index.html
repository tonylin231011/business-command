const E={"id": "STR-0001", "version": 4, "title": "千团大战：下一笔钱", "sources": [{"id": "S1", "date": "2011-03-14", "title": "北京商报：过期包退计划（同期报道）", "url": "https://finance.ifeng.com/news/special/2011315/20110314/3655793.shtml"}, {"id": "S2", "date": "2011-07-07", "title": "新浪科技：B轮融资发布会（同期采访）", "url": "https://tech.sina.com.cn/i/2011-07-07/11005745178.shtml"}, {"id": "S3", "date": "2011-07-07", "title": "经济观察网：融资与广告策略（同期采访）", "url": "https://www.eeo.com.cn/2011/0707/205540.shtml"}, {"id": "S4", "date": "2011-11-11", "title": "新浪科技：IPO延迟（消息来源含匿名人士，原因未获独立证实）", "url": "https://tech.sina.com.cn/i/2011-11-11/09216306701.shtml"}, {"id": "S5", "date": "2012-06-21", "title": "北京青年报：拉手6月19日撤销申请", "url": "https://msn.finance.sina.com.cn/gdxw/20120621/0000998863.html"}, {"id": "S6", "date": "2014-02-21", "title": "王兴十年（回顾性人物报道，清华校友总会转载）", "url": "https://www.tsinghua.org.cn/info/1014/11230.htm"}], "scenes": [{"date": "2011 · 03", "eyebrow": "第一幕 / 一张没有消费的券", "title": "钱已经收到了。\n生意结束了吗？", "scene": "把时间拨回2011年3月，退款政策公布前的教学回放。你坐在美团经营者的位置：消费者先付钱购买团购券，随后到线下商家消费。网站上的支付完成了，线下的服务却可能还没有开始。", "tension": "现在，一类钱留在平台上：券过期了，消费者没有消费。你要决定，平台怎样处理这类钱。它关系到的不只是一笔支出，还有你准备向消费者出售什么样的承诺。", "known": "预付款团购模式", "unknown": "自由现金、净流出、退款后的复购变化", "dossiers": [{"name": "消费者", "tag": "角色视角 · 教学演绎", "title": "我买的，是一次服务。", "body": "“券已经过期，我确实没去。但这笔钱，难道就没有办法处理了？”\n对消费者而言，付款和得到服务是两件事。有人会提出退款，有人不会。他们会不会再买，材料没有告诉你。", "note": "这段台词用于呈现利益冲突，不是真实投诉记录。"}, {"name": "增长团队", "tag": "角色视角 · 教学演绎", "title": "同一笔资源，也可以带来新客。", "body": "“我们当然希望消费者满意。但如果马上推出全面退款，系统、客服和资金都要跟上。把同样的力量用来做新的团购，我们也许可以拉来更多用户。”\n他们要求你考虑兑现新承诺所挤占的其他工作。", "note": "这是待检验的经营主张，没有提供获客与退款回报的比较数据。"}, {"name": "资金备忘", "tag": "机制材料 · 非公司账簿", "title": "没有消费的券，怎么结清？", "body": "团购把线上收款与线下消费分开。不同结算规则会影响平台什么时候向商户付款，退款规则又会改变平台对用户的义务。\n本案没有拿到当期完整协议和现金明细。你不能从“款在账上”直接推算可自由投入的金额。", "note": "本幕不提供虚构的现金跑道。政策发布日期前的具体会议无法还原，决策菜单为教学重构。"}], "question": "你会批准哪一种过期券处理方案？", "options": [{"id": "claims", "name": "逐笔申请，审核退款", "pitch": "先建立申请渠道，核验后处理；暂不承诺对所有过期未消费券统一退款。", "cost": "现金支出可能分散，但用户要承担申请与等待成本。", "assumption": "个案处理能以较低成本解决主要不满。", "test": "如果大量未申请用户同样流失，少量投诉并不能证明政策有效。", "challenge": "你降低的是服务问题，还是仅仅降低了被看见的问题？"}, {"id": "refund", "name": "建立统一过期退款政策", "pitch": "把退款变成明确规则，配套系统与客服，对未消费款按规则退回。", "cost": "需要承担退款支出和履约建设；回头客是否因此增加，尚不确定。", "assumption": "确定的退款承诺值得它的资金与执行成本。", "test": "即使复购没有明显增加，你是否仍有足够依据支持这项承诺？", "challenge": "“对客户好”还不是完整预算，你给兑现承诺安排了什么资源？"}, {"id": "terms", "name": "先按现有条款处理", "pitch": "暂不新增普遍退款承诺，改善购买说明和到期提醒，再决定是否改变政策。", "cost": "减少新增承诺，但已产生的不满可能延续；条款的法律适用仍需审查。", "assumption": "更清晰的说明与提醒可以解决主要问题。", "test": "如果理解条款的人仍不愿再买，仅优化说明可能不够。", "challenge": "你解决的是信息误解，还是消费者不接受这种交易关系？"}], "actual": "美团在2011年3月推出过期退款。同期北京商报报道涉及此前未消费款项1000余万元；2014年人物回顾也记载了该政策与资金影响。[S1/S6]", "why": "人物报道将这一选择解释为争取消费者信任与口碑。它是一项关于长期交易关系的判断，并非已经证明“每退一元就能赚回更多”。历史资料没有给出可用于归因的对照实验。", "insight": "少留一笔钱，可能是在建立下一次交易的条件。账面留存与可持续生意，不是同一个目标。", "compare": ["逐笔申请能控制执行节奏，但申请门槛也会筛掉不愿交涉的用户，不能只看已解决投诉。", "统一政策把承诺从个案变成规则，但系统兑现、资金准备与效果检验都不能省。", "条款与提醒可以减少误会，却未必改变用户对交易公平性的感受。"], "bridge": "退款政策成为承诺。新的问题随之而来：还要继续获客、拓展商户、建设团队。把日历翻到7月，一笔融资到账——现在，关于钱怎么花的争论会更大。", "sources": ["S1", "S6"], "npcs": [{"id": "npc0", "role": "客户代表", "name": "林女士", "interest": "交易的另一边", "greeting": "我付过钱，但服务还没有发生。", "color": "#efb65a", "questions": [{"q": "我最在意什么？", "a": "券过期以后，按规则你们也许能解释清楚。但从我这边看，我还没有真正得到那次服务。下次买券，我会更在意：如果计划又变了，会怎么办。"}, {"q": "只看投诉，能知道我的感受吗？", "a": "愿意打电话申请的人，只是消费者中的一部分。没申请的人可能不介意，也可能懒得再交涉。没有更多材料，我不能替他们回答。"}, {"q": "给我看原始材料。", "a": "“券已经过期，我确实没去。但这笔钱，难道就没有办法处理了？”\n对消费者而言，付款和得到服务是两件事。有人会提出退款，有人不会。他们会不会再买，材料没有告诉你。"}], "clue": "未投诉，不代表满意。", "tag": "角色视角 · 教学演绎"}, {"id": "npc1", "role": "增长负责人", "name": "周衡", "interest": "必须继续争取新客", "greeting": "下一批商户，也在等我们带人过去。", "color": "#7ac4b2", "questions": [{"q": "为什么不能立刻全部退款？", "a": "我担心兑现新承诺会占用资金、系统和客服。那些资源也能用于获取新客。但我没有证明哪一种投入回报更高。"}, {"q": "你愿意怎样检验自己的主张？", "a": "先把两件事分开看：获客带来了多少能留下的客户，以及退款处理减少了什么问题。不能把新增订单直接当成新增利润。"}, {"q": "给我看原始材料。", "a": "“我们当然希望消费者满意。但如果马上推出全面退款，系统、客服和资金都要跟上。把同样的力量用来做新的团购，我们也许可以拉来更多用户。”\n他们要求你考虑兑现新承诺所挤占的其他工作。"}], "clue": "获客与兑现承诺争夺资源。", "tag": "角色视角 · 教学演绎"}, {"id": "npc2", "role": "资金负责人", "name": "许岚", "interest": "资金与义务", "greeting": "先说清这笔钱可以怎么用。", "color": "#a7adf0", "questions": [{"q": "账上的钱，都能拿去增长吗？", "a": "还不能这样判断。我们需要结算规则、未完成服务、退款安排和资金明细。这个案卷没有完整账簿，不能编一个可用余额。"}, {"q": "我们眼下最缺哪项信息？", "a": "缺的是资金义务与真正可调度金额的边界。没有它，保留资金与投入增长都可能只是一个听起来合理的口号。"}, {"q": "给我看原始材料。", "a": "团购把线上收款与线下消费分开。不同结算规则会影响平台什么时候向商户付款，退款规则又会改变平台对用户的义务。\n本案没有拿到当期完整协议和现金明细。你不能从“款在账上”直接推算可自由投入的金额。"}], "clue": "账面金额 ≠ 可调度资金。", "tag": "机制材料 · 非公司账簿"}]}, {"date": "2011 · 07 · 07", "eyebrow": "第二幕 / 钱到账以后", "title": "你终于有钱了。\n要按谁的节奏花？", "scene": "美团宣布B轮5000万美元融资完成，资金已到账。成立一年多，公司披露截至5月底已在近100个城市开站、员工1800多人。你面对的已不是一间办公室，而是一张分散在各地的经营网络。[S2]", "tension": "如果新钱只停在账户上，团队会问增长机会在哪里；如果快速铺出去，你得回答花出去之后能留下什么。这次你要批准的，是获客与建设的主方向。", "known": "5000万美元 / 本轮融资", "unknown": "各渠道获客成本、留存、城市贡献", "dossiers": [{"name": "融资通报", "tag": "同期报道 · S2", "title": "资金到账，不等于问题解决。", "body": "2011年7月7日融资发布会：阿里巴巴领投，另有机构跟投。报道转述首轮资金尚未使用。\n这是融资与公开表述，不是经本课程审计的自由现金余额。不同币种、商户结算与退款义务也未完整列出。", "note": "公司披露的销售预期不是已经实现的收入或利润，本幕不把它当业绩。"}, {"name": "城市一线", "tag": "利益冲突 · 教学演绎", "title": "商户问：你能带来多少人？", "body": "“每次谈商户，我们都要证明自己能带来顾客。只有后台能力，没有人知道我们，怎么签单？”\n前线希望得到能被商户看见的支持。你需要决定：是买来广泛知名度，还是以更接近购买的渠道触达客户。", "note": "不是当年现场对话。真实历史中的广告争论将在签批后展示。"}, {"name": "投入清单", "tag": "教学议案 · 无虚构金额", "title": "三个都能花钱的地方。", "body": "品牌广告：先让更多人认识平台，再争取交易。\n交易获客与交付：在已有购买意图的人群中获客，同时改善商户服务。\n现金储备：减少当下承诺，为未来变局留下余地。\n三者都可能有价值，本幕缺少能直接排出回报高低的数据。", "note": "你决定优先级，不是假装能计算一个未经提供数据支持的最优预算。"}], "question": "你把新增投入的主方向放在哪里？", "options": [{"id": "ads", "name": "品牌曝光优先", "pitch": "推进大范围品牌投放，给各地销售统一的知名度支持。", "cost": "覆盖面大，但从看到广告到复购之间仍有缺口。", "assumption": "品牌认知能以可接受成本转化为交易与留存。", "test": "如果曝光上涨而有效新客没有增加，你愿意何时停投？", "challenge": "你的依据能证明客户资产增加，还是只能证明更多人见过广告？"}, {"id": "direct", "name": "交易获客与交付优先", "pitch": "优先可跟踪的购买渠道及商户服务建设，逐项验证再追加。", "cost": "触达可能更窄，前线也可能认为品牌声量不足。", "assumption": "接近交易的获客方式能留下更好的单位贡献。", "test": "若低成本渠道规模受限、无法支撑增长，何时改变组合？", "challenge": "能追踪并不自动等于增量，原本就会购买的人也可能被算进效果。"}, {"id": "reserve", "name": "新增投入暂缓放行", "pitch": "先核清资金义务与现有城市表现，再分批审批新增预算。", "cost": "保留机动空间，但已有资金无法自动形成竞争位置。", "assumption": "等待所得的信息价值，大于错过窗口的成本。", "test": "哪一项信息一旦查明，你就必须放行，不能继续无限等待？", "challenge": "你给团队的是一条可执行的审批门槛，还是一个没有期限的“再看看”？"}], "actual": "美团公开列出的资金用途包括服务、技术和人才。[S2] 同期采访报道其不准备加入广告烧钱战。[S3] 事后报道记载了其购买搜索关键词和导航渠道的做法。[S6]", "why": "回顾性材料给出的解释，是更重视靠近购买环节的触达，并保留资金。这并非“完全不打广告”。我们可以确认所报道的渠道取舍，不能把它简化成品牌广告永远无效。", "insight": "历史里的分歧不是“花钱还是不花钱”，而是为哪一段转化付钱，以及用什么证据继续付钱。", "compare": ["品牌曝光可能帮助销售、积累认知；缺少增量与留存验证时，它也可能成为竞争性加码。", "交易渠道更容易观察转化；但归因、容量和服务承载决定它能不能扩大。", "储备保留选择权；只有明确了重新放行的条件，储备才不会变成长期停滞。"], "bridge": "你已经签下投入方向。四个月后，一条对手的消息传来。它看起来像机会，也可能意味着你所处的整个行业都将更难融资。", "sources": ["S2", "S3", "S6"], "npcs": [{"id": "npc0", "role": "融资联络人", "name": "许岚", "interest": "已到款的融资通报", "greeting": "钱到了。请别把融资新闻当成预算表。", "color": "#efb65a", "questions": [{"q": "这笔融资能确认什么？", "a": "2011年7月7日，美团宣布B轮5000万美元资金到账。同期报道转述首轮资金尚未使用。这是融资与公开表述，不是课程审计过的现金明细。[S2]"}, {"q": "能据此算出还能活多久吗？", "a": "不能。缺少实际净流出、结算和退款义务。金额本身不能推出现金跑道，也不等于所有城市都值得追加投入。"}, {"q": "给我看原始材料。", "a": "2011年7月7日融资发布会：阿里巴巴领投，另有机构跟投。报道转述首轮资金尚未使用。\n这是融资与公开表述，不是经本课程审计的自由现金余额。不同币种、商户结算与退款义务也未完整列出。"}], "clue": "5000万美元是融资额，不是跑道。", "tag": "同期报道 · S2"}, {"id": "npc1", "role": "城市负责人", "name": "周衡", "interest": "商户谈判的一线", "greeting": "你得让我有东西可以带去见商户。", "color": "#7ac4b2", "questions": [{"q": "你为什么要总部支持广告？", "a": "如果商户不知道平台能带来顾客，销售很难建立合作。我希望品牌声量帮助谈判。但这是我的工作诉求，不是广告效果已经得到证明。"}, {"q": "什么证据会让你改变看法？", "a": "如果另外的渠道能稳定带来有贡献、能留存的客户，我愿意换组合。反过来，便宜但容量很小的渠道，也解决不了所有城市的增长。"}, {"q": "给我看原始材料。", "a": "“每次谈商户，我们都要证明自己能带来顾客。只有后台能力，没有人知道我们，怎么签单？”\n前线希望得到能被商户看见的支持。你需要决定：是买来广泛知名度，还是以更接近购买的渠道触达客户。"}], "clue": "前线需要流量，渠道仍需验证。", "tag": "利益冲突 · 教学演绎"}, {"id": "npc2", "role": "经营负责人", "name": "沈砚", "interest": "投入方案的另一面", "greeting": "能看见成交，还要知道它从哪里来。", "color": "#a7adf0", "questions": [{"q": "你建议先比较什么？", "a": "品牌曝光、接近交易的获客、商户交付与资金储备都可能有用。具体回报数据尚未提供，不能直接排出一个最优预算。"}, {"q": "能追踪，就等于有效吗？", "a": "不等于。一个原本就会购买的人，也可能被记在渠道名下；一个便宜渠道也可能很快触顶。我们需要增量、贡献和承载的证据。"}, {"q": "给我看原始材料。", "a": "品牌广告：先让更多人认识平台，再争取交易。\n交易获客与交付：在已有购买意图的人群中获客，同时改善商户服务。\n现金储备：减少当下承诺，为未来变局留下余地。\n三者都可能有价值，本幕缺少能直接排出回报高低的数据。"}], "clue": "可追踪 ≠ 有增量。", "tag": "教学议案 · 无虚构金额"}]}, {"date": "2011 · 11 · 11", "eyebrow": "第三幕 / 机会来了，谁接得住", "title": "对手慢下来了。\n你的组织准备好了吗？", "scene": "媒体报道拉手网暂停路演、推迟赴美IPO。注意，此刻是推迟，不是最终撤销；关于具体原因的说法包含匿名消息，不能直接当作已经查明的事实。[S4]", "tension": "假如商户、人才或区域机会真的松动，你会冲上去吗？你能不能把新机会交给一个能执行的组织，而不只是把新的目标交给更多人？下一张命令，关系到扩张的承载方式。", "known": "IPO推迟 / 非最终结局", "unknown": "融资窗口持续时间、各区域承载能力", "dossiers": [{"name": "市场快讯", "tag": "同期报道 · S4", "title": "一条消息，两个方向。", "body": "拉手IPO进程受阻，会影响其融资节奏；这不代表它已经退出竞争。\n同期报道也记录了业内对融资和商户信心的担忧。那是受访者的判断，不是所有投资人已经停止投资的证据。", "note": "没有给你对手现金余额，不可推算对手还能活几个月。"}, {"name": "区域负责人", "tag": "角色视角 · 教学演绎", "title": "给我城市，也要给我支撑。", "body": "“如果现在有机会，我们能不能接？新的商户谁带，新的销售谁教，服务出问题谁来纠正？”\n多一个城市，意味着多一组当地关系和日常执行。总部看见总量，不等于已经看见每个城市的异常。", "note": "这是规模化运营的情境设问，不是对美团当时具体故障的指控。"}, {"name": "组织议案", "tag": "教学议案 · 尚未揭晓历史", "title": "你要改变哪一种工作？", "body": "把力量放在争取新商户与人才：机会短暂，先争取位置。\n把力量放在守住现有履约与结算：先降低外部冲击的伤害。\n把力量放在区域管理与销售训练：先建立扩大业务的承载能力。", "note": "三条路线可以组合；本轮要求你明确谁优先，哪项工作必须让位。"}], "question": "下一阶段，哪一项工作优先拿到团队的精力？", "options": [{"id": "expand", "name": "先抢商户与人才", "pitch": "设定边界后主动争取机会，让现有团队承担接入。", "cost": "行动快，但新业务可能超过管理和交付能力。", "assumption": "现有组织可以承接增加的业务复杂度。", "test": "若新增业务持续挤压老客户交付，你会如何缩小范围？", "challenge": "对手变弱，是外部机会；你接得住，是另一项需要证据的判断。"}, {"id": "hold", "name": "先稳现有经营", "pitch": "放慢新增动作，优先履约、退款与商户结算。", "cost": "对坏情景更有准备，也可能错过结构性机会。", "assumption": "当前最大的损失风险来自资金与履约波动。", "test": "如果现有履约已经稳定，你还会用什么条件限制所有新增动作？", "challenge": "你保护了今天的生意，是否也安排了让明天更有效率的工作？"}, {"id": "org", "name": "先建区域指挥体系", "pitch": "明确区域负责人，配套销售训练、经营反馈与异常处理，再放行扩张。", "cost": "调整需要时间，也会占用正在做业务的人。", "assumption": "管理承载是限制业务扩大的关键环节。", "test": "如果只是增加会议与层级，经营没有改善，何时调整方案？", "challenge": "你批准的是新的组织图，还是可以追责、反馈和纠偏的运行方式？"}], "actual": "回顾性人物报道记载，干嘉伟于2011年11月16日加入美团，随后调整区域管理，把两个大区分为八个。[S6] 这证明了组织建设动作，不能证明其他工作全被停止。", "why": "把范围分小、责任明确，可能改善信息传递和执行。这个机制解释了组织投入为什么值得考虑；但增加大区数量本身不是成功的充分条件，我们没有一组能隔离该调整效果的实验数据。", "insight": "资金让你有资格继续竞争，组织决定你能不能把一次机会变成反复做到的能力。", "compare": ["抢位能利用短暂机会；没有接入门槛，可能同时损伤新增和存量业务。", "守住经营有价值；如果连效率改进也停下，就只是延长原有问题。", "区域管理有历史动作支持；价值要落在责任、反馈与执行，不能由组织名称证明。"], "bridge": "历史继续往前走，你的三次判断留在桌上。现在不按“像不像王兴”算分，而是检查你自己说过的理由、愿意承担的代价，以及下一次会如何改变。", "sources": ["S4", "S6"], "npcs": [{"id": "npc0", "role": "市场联络人", "name": "许岚", "interest": "一条尚未定局的消息", "greeting": "拉手的IPO消息来了。先别庆功。", "color": "#efb65a", "questions": [{"q": "消息确认到哪一步？", "a": "媒体报道路演暂停、IPO推迟。此刻没有最终撤销的结论。关于原因的说法含匿名消息，不能直接当作已查明事实。[S4]"}, {"q": "这会影响我们什么？", "a": "它可能改变竞争对手的融资节奏，也可能让商户和投资人重新看待行业风险。但材料不足以判断所有人的行动，更不知道对手现金余额。"}, {"q": "给我看原始材料。", "a": "拉手IPO进程受阻，会影响其融资节奏；这不代表它已经退出竞争。\n同期报道也记录了业内对融资和商户信心的担忧。那是受访者的判断，不是所有投资人已经停止投资的证据。"}], "clue": "推迟IPO ≠ 已退出竞争。", "tag": "同期报道 · S4"}, {"id": "npc1", "role": "区域负责人", "name": "周衡", "interest": "机会的承接者", "greeting": "多给我一座城，还要给我接住它的方法。", "color": "#7ac4b2", "questions": [{"q": "你最担心扩大后的什么问题？", "a": "新增商户要有人接入，销售要有人训练，异常要有人纠正。总部看见总量，不等于已经知道各城发生了什么。这是经营机制设问，不是历史故障记录。"}, {"q": "如果现在有机会，要不要先拿？", "a": "机会可能短暂，等待也有代价。我的要求是说清谁负责接入、什么条件放行；不能只把一个新目标加到原来的团队头上。"}, {"q": "给我看原始材料。", "a": "“如果现在有机会，我们能不能接？新的商户谁带，新的销售谁教，服务出问题谁来纠正？”\n多一个城市，意味着多一组当地关系和日常执行。总部看见总量，不等于已经看见每个城市的异常。"}], "clue": "有机会，也要有承载门槛。", "tag": "角色视角 · 教学演绎"}, {"id": "npc2", "role": "经营负责人", "name": "沈砚", "interest": "组织议案的提出者", "greeting": "组织不是多画几根汇报线。", "color": "#a7adf0", "questions": [{"q": "建区域体系，具体改变什么？", "a": "可以明确谁负责、哪些异常上报、如何训练销售，再按能力放行扩张。但这些是教学议案，不是已经查明的内部会议记录。"}, {"q": "我们怎样识别无效调整？", "a": "如果只是会议变多、报表变多，交付与纠偏没有改善，组织图就还没有成为经营能力。你需要给调整一个可观察的验证条件。"}, {"q": "给我看原始材料。", "a": "把力量放在争取新商户与人才：机会短暂，先争取位置。\n把力量放在守住现有履约与结算：先降低外部冲击的伤害。\n把力量放在区域管理与销售训练：先建立扩大业务的承载能力。"}], "clue": "责任、反馈、纠偏要能运行。", "tag": "教学议案 · 尚未揭晓历史"}]}]};

function validRunV3(r){return r&&typeof r.id==='string'&&Array.isArray(r.decisions)&&r.decisions.length<=3&&r.decisions.every((d,i)=>E.scenes[i].options.some(o=>o.id===d.option)&&typeof d.reason==='string'&&typeof d.stop==='string'&&typeof d.reflection==='string'&&Number.isFinite(d.confidence)&&d.confidence>=0&&d.confidence<=100)&&Number.isInteger(r.index)&&r.index>=0&&r.index<=3&&['desk','reveal','report'].includes(r.phase)&&r.index===(r.phase==='reveal'?r.decisions.length-1:r.decisions.length)&&(r.phase!=='desk'||r.index<3)&&(r.phase!=='report'||r.index===3)&&r.drafts&&typeof r.drafts==='object'&&Object.entries(r.drafts).every(([k,d])=>['0','1','2'].includes(k)&&validDraft(d,Number(k)))}
function validDraft(d,i){return d&&typeof d.reason==='string'&&typeof d.stop==='string'&&Number.isFinite(d.confidence)&&d.confidence>=0&&d.confidence<=100&&Number.isInteger(d.tab)&&d.tab>=0&&d.tab<3&&Array.isArray(d.read)&&d.read.every(n=>Number.isInteger(n)&&n>=0&&n<3)&&(d.option===null||E.scenes[i].options.some(o=>o.id===d.option))}
function validDB(v){return v.schemaVersion===3&&v.episode===E.id&&Array.isArray(v.runs)&&v.runs.every(validRun)&&(!v.active||validRun(v.active))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{saveWarning=true;notify('本机保存失败，请从“我的档案”导出备份。');return false}}
function notify(t){$('announce').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('announce').innerHTML='',4500)}
function scrollStageTop(){window.scrollTo({top:0,behavior:'instant'});$('app').setAttribute('tabindex','-1');$('app').focus({preventScroll:true})}
function footer(){return '<footer class="footer"><span>个人商学院 / 真实商业 · 独立判断</span><span>V4.0 · 无需会员或AI接口 · 进度保存在当前浏览器</span></footer>'}
function city(){let blocks='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){let x=135+(c-r)*23,y=115+(c+r)*12,h=8+((r*13+c*7)%5)*6;blocks+=`<path d="M${x} ${y}l17 9 -17 9 -17 -9z" fill="#34515a"/><path d="M${x-17} ${y+9}v${-h}l17 9v${h}z" fill="#456571"/><path d="M${x} ${y+18}v${-h}l17 -9v${h}z" fill="#28434d"/><path d="M${x-17} ${y+9-h}l17 -9 17 9 -17 9z" fill="${(r+c)%4===0?'#ae9463':'#68847d'}"/>`};return `<div class="city"><div class="city-label">一座城市，三种账本</div><div class="number">2011</div><svg viewBox="-100 0 500 390" role="img" aria-label="抽象城市经营网络示意，非真实地理或经营数据"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#749390" stroke-opacity=".1"/></pattern></defs><rect x="-100" width="500" height="390" fill="url(#grid)"/><g transform="translate(20 4)">${blocks}<path d="M-60 235L135 130 325 232M-35 265L136 175 290 260" fill="none" stroke="#dab76c" stroke-width="2" opacity=".7"/><g class="pulse" fill="#ffe1a0"><circle cx="135" cy="130" r="5"/><circle cx="-35" cy="265" r="4"/><circle cx="290" cy="260" r="4"/></g></g></svg><div class="city-caption">顾客的承诺 / 商户的生意 / 平台的下一笔钱<br>概念示意 · 非历史地图</div></div>`}
function home(){let active=db.active;$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">商业纪实互动剧场 / 案卷 STR-0001</div><h1>千团大战<br><em>下一笔钱</em></h1><p>一家年轻的平台，一座座要拿下的城市。<br>钱从消费者、商户和投资人手中经过。<br>现在，你决定它流向哪里。</p><div class="actions"><button class="btn primary" onclick="${active?'render()':'begin()'}">${active?'回到决策桌':'进入 2011 年'} <span>↗</span></button>${active?'<button class="btn" onclick="restart()">重新入局</button>':''}</div><p class="note">三幕完整体验 · 约 20 分钟 · 可随时离开再继续</p></div>${city()}</section><section class="ribbon"><div><span>你的位置</span><b>美团经营决策席</b></div><div><span>你要面对</span><b>承诺 / 获客 / 组织</b></div><div><span>信息规则</span><b>只知道当时能知道的</b></div><div><span>你带走的</span><b>自己的判断与修正</b></div></section><section class="intro"><div><div class="eyebrow">在命令之前 / 先理解这门生意</div><h2 style="margin-top:12px">网站上的一笔成交，<br>线下才刚刚开始。</h2><p>消费者在线买券，商户在线下接待。平台要让两边愿意再来。销售谈下一个商户，产品让下一笔订单更顺利，客服接住兑现不了的承诺。每个岗位都有理由向你要资源。</p><p>你将站在王兴的经营决策位置，但不需要猜他“正确的答案”。你需要在信息不完整时，说明自己愿意承担什么，又准备在何时改变主意。</p><div class="margin-note">每幕先翻阅三份材料，再签下命令。历史随后揭封；你的理由会留在旁边，接受同一组事实的检验。</div></div><aside class="paper"><span class="stamp">角色档案 / 过去已知</span><h3 class="serif" style="font-size:24px;margin-top:18px">这不是第一次创业。</h3><p>回顾性人物报道记载，王兴在美团之前经历过校内网出售与饭否停服。这里仅取2011年以前的经历，不把后来结果带进决策。[S6]</p><p>2010年3月，美团成立。[S2] 这一次，互联网产品之外，还有真实商户、线下服务和需要持续运转的城市团队。</p><p class="note">角色处境由历史材料改编；界面中的会议、台词与选项均为教学演绎，并非当事人会议实录。</p></aside></section><div class="notice">本集训练资源取舍：把熟悉的城市与渠道经营经验，迁移到新的商业模式。目标是为现实业务与自己的小额项目建立判断依据，而不是在模拟里追求无代价增长。${saveWarning?' <strong>浏览器存储不可用或记录损坏，请注意导出。</strong>':''}</div>${footer()}`}
function begin(){db.active={id:String(Date.now()),episode:E.id,version:4,startedAt:new Date().toISOString(),phase:'desk',index:0,drafts:{},decisions:[]};save();render()}
function restart(){if(confirm('当前进度会保留在档案中，然后开始新局。继续？')){if(db.active)db.runs.push({...db.active,archivedAt:new Date().toISOString(),incomplete:db.active.decisions.length<3});begin()}}
function draft(){let r=db.active;return r.drafts[r.index]||(r.drafts[r.index]={option:null,reason:'',stop:'',confidence:60,read:[],tab:0})}
function shell(content){let r=db.active,i=Math.min(r.index,2),s=E.scenes[i];return `<div class="progress"><span class="active">入局</span><span class="line"></span>${['承诺','获客','组织'].map((x,k)=>`<span class="${k<=i?'active':''}">${String(k+1).padStart(2,'0')} ${x}</span><span class="line"></span>`).join('')}<span class="${r.phase==='report'?'active':''}">复盘</span></div><div class="layout"><aside class="rail"><div class="eyebrow">经营决策桌</div><h3 class="serif">${s.date}</h3><small>STR-0001 / 千团大战</small><div class="meter"><span class="eyebrow">已经知道</span><b>${s.known}</b></div><div class="meter"><span class="eyebrow">仍未知道</span><small>${s.unknown}</small></div><div class="chapter"><div class="now">${r.phase==='desk'?'● 阅读材料 → 签批命令':r.phase==='reveal'?'● 命令已封存 → 历史揭封':'● 三幕结束 → 整理判断'}</div><div>下一幕情报尚未开放</div></div><div class="meter"><button class="plain small" onclick="home();scrollStageTop()">← 返回封面，保留进度</button></div></aside><section class="stage">${content}</section></div>${footer()}`}
function render(){if(!db.active)return home();if(db.active.phase==='desk')desk();else if(db.active.phase==='reveal')reveal();else report();scrollStageTop()}
function dossierHTML(s,d){let x=s.dossiers[d.tab];return `<div class="eyebrow">${x.tag}</div><h3 class="serif">${x.title}</h3><p>${x.body}</p><p class="note">${x.note}</p>`}
function desk(){let r=db.active,s=E.scenes[r.index],d=draft();if(!d.read.includes(d.tab))d.read.push(d.tab);save();$('app').innerHTML=shell(`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lede">${s.scene}</p><p class="tension">${s.tension}</p><div class="section-head"><h2>桌上的三份材料</h2><span id="readcount" class="small muted">已打开 ${d.read.length}/3 · 可反复查阅</span></div><div class="tabs" role="tablist" aria-label="决策材料">${s.dossiers.map((x,k)=>`<button id="tab${k}" class="tab" role="tab" aria-controls="dossier" aria-selected="${d.tab===k}" onclick="openDossier(${k})"><span>材料 0${k+1} ${d.read.includes(k)?'· 已打开':''}</span>${x.name}</button>`).join('')}</div><article id="dossier" class="dossier" role="tabpanel" aria-labelledby="tab${d.tab}">${dossierHTML(s,d)}</article><div class="section-head"><h2>你的签批</h2><span class="small muted">三个方案均为教学设计</span></div><h3 style="font-size:20px;margin-bottom:18px">${s.question}</h3>${s.options.map((o,k)=>`<button class="choice" id="opt${k}" aria-pressed="${d.option===o.id}" onclick="choose(${k})"><span class="letter">${'ABC'[k]}</span><span><strong>${o.name}</strong><p>${o.pitch}</p><small>要承担的代价 / ${o.cost}</small></span></button>`).join('')}<div class="order"><div class="eyebrow">给团队的一句话 / 将原样进入复盘</div><label for="reason">为什么签这条命令？你愿意承担什么代价？</label><textarea id="reason" placeholder="用你的话说，不需要术语。" oninput="writeDraft('reason',this.value)">${esc(d.reason)}</textarea><label for="stop">看到什么具体变化，你会改变命令？</label><textarea id="stop" placeholder="留下一个能让你改主意的条件。" oninput="writeDraft('stop',this.value)">${esc(d.stop)}</textarea><label for="confidence">你对这条路线的把握：<output id="confidenceOut">${d.confidence}%</output></label><input id="confidence" type="range" min="0" max="100" step="5" value="${d.confidence}" oninput="writeDraft('confidence',Number(this.value));$('confidenceOut').textContent=this.value+'%'" aria-label="决策把握百分比"><div class="range-row muted"><span>尚在试探</span><span>较有把握</span><span>非常确定</span></div><p class="note">这是自报把握，不能直接当作事件概率计算校准得分。</p><div id="formstatus" class="status" role="status"></div><button class="btn primary" onclick="commit()">签下命令，打开历史 ↗</button></div>`)}
function openDossier(k){let d=draft(),s=E.scenes[db.active.index];d.tab=k;if(!d.read.includes(k))d.read.push(k);save();$('dossier').innerHTML=dossierHTML(s,d);$('dossier').setAttribute('aria-labelledby','tab'+k);s.dossiers.forEach((x,j)=>{$('tab'+j).setAttribute('aria-selected',j===k);$('tab'+j).innerHTML=`<span>材料 0${j+1} ${d.read.includes(j)?'· 已打开':''}</span>${x.name}`});$('readcount').textContent=`已打开 ${d.read.length}/3 · 可反复查阅`}
function choose(k){let d=draft(),s=E.scenes[db.active.index];d.option=s.options[k].id;s.options.forEach((o,j)=>$('opt'+j).setAttribute('aria-pressed',j===k));save()}
function writeDraft(k,v){draft()[k]=v;save()}
function commit(){let r=db.active,d=draft();if(!d.option||d.reason.trim().length<4||d.stop.trim().length<4){$('formstatus').textContent='请选定路线，并留下你的理由和改变命令的条件（各至少4个字）。';return}if(d.read.length<3){$('formstatus').textContent='还有材料未打开。先听完三方意见，再签下命令。';return}r.decisions.push({...d,signedAt:new Date().toISOString(),reflection:'',selfCheck:null});r.phase='reveal';save();render()}
function sources(ids){return `<details class="source-list"><summary>本幕史料与证据边界（原文可能含后续剧情）</summary>${ids.map(id=>{let x=E.sources.find(x=>x.id===id);return `<p>[${id}] ${x.date} <a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.title} ↗</a></p>`}).join('')}<p>同期报道、当事人主张和事后回顾不等于完整内部档案。资料未记录全部备选方案，本页的替代路线比较属于教练分析。</p></details>`}
function revealV3(){let r=db.active,s=E.scenes[r.index],d=r.decisions[r.index],o=s.options.find(x=>x.id===d.option);$('app').innerHTML=shell(`<div class="eyebrow">命令已封存 / 第 ${r.index+1} 幕逐幕对照</div><h1>先别急着往下走。<br>看看你刚才押注了什么。</h1><div class="seal"><div class="eyebrow">你的命令 / ${esc(o.name)} / 把握 ${d.confidence}%</div><blockquote>“${esc(d.reason)}”</blockquote><p class="small muted">你承诺的改变条件：${esc(d.stop)}</p></div><article class="reveal"><div class="eyebrow">01 / 历史揭封</div><h2>当事人实际做了什么</h2><p>${s.actual}</p><div class="eyebrow" style="margin-top:25px">02 / 为什么这样做</div><p>${s.why}</p>${sources(s.sources)}</article><div class="insight">${s.insight}</div><article class="reveal"><div class="eyebrow">03 / 你的路线，最需要经受这一问</div><h2>${o.challenge}</h2><p><b>这条路线依赖的假设：</b>${o.assumption}</p><p><b>把你的理由放到这个情境中：</b>${o.test}</p><p class="note">以上是根据所选路线生成的对照，不是对自由文字的AI评分。若你的原话已处理这个风险，应保留你的论证，不因历史路线不同而判错。</p><label for="reflection" style="display:block;margin:20px 0 8px">你要保留或修正哪一点？ <span class="small muted">选填，自动保存</span></label><textarea id="reflection" placeholder="我原先认为……现在我会保留／调整……" oninput="reflect(this.value)">${esc(d.reflection)}</textarea><div class="actions"><button class="btn" aria-pressed="${d.selfCheck==='covered'}" onclick="selfCheck('covered')">我的原判断已考虑</button><button class="btn" aria-pressed="${d.selfCheck==='revise'}" onclick="selfCheck('revise')">我需要修正</button><span id="selfstatus" class="small muted">${d.selfCheck==='covered'?'已记录：原判断已考虑':d.selfCheck==='revise'?'已记录：需要修正':''}</span></div></article><div class="section-head"><h2>另外两条路，为什么也会有人选？</h2></div><div class="alternatives">${s.options.map((x,k)=>`<div class="alternative ${x.id===d.option?'chosen':''}"><span class="eyebrow">${'ABC'[k]} ${x.id===d.option?'你的选择':''}</span><h3>${x.name}</h3><p>${s.compare[k]}</p></div>`).join('')}</div><div class="paper" style="margin-top:28px"><div class="eyebrow">下一封来信</div><p style="margin-top:12px">${s.bridge}</p><p class="note">后续按真实历史推进，不把历史结果伪装成你的选择造成的结果。</p><div class="actions"><button class="btn primary" onclick="advance()">${r.index<2?'我已看完，进入下一幕 →':'整理我的决策档案 →'}</button></div></div>`)}
function reflect(v){db.active.decisions[db.active.index].reflection=v;save()}
function selfCheck(v){db.active.decisions[db.active.index].selfCheck=v;save();$('selfstatus').textContent=v==='covered'?'已记录：原判断已考虑':'已记录：需要修正';document.querySelectorAll('[onclick^="selfCheck"]').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('onclick').includes(v)))}
function advance(){let r=db.active;r.decisions[r.index].reviewedAt=new Date().toISOString();r.index++;r.phase=r.index===3?'report':'desk';if(r.index===3)r.completedAt=new Date().toISOString();save();render()}
function report(){let r=db.active;$('app').innerHTML=`<div class="eyebrow">个人经营档案 / STR-0001 / 三幕已完成</div><h1 style="font-size:46px;margin:20px 0">留下你的判断，<br>而不只是历史答案。</h1><p class="lede muted">三次命令都已封存。这里不以“和王兴选得一样”给你高分；你的理由、改变条件和修正，才是之后可以复测的东西。</p><div class="ribbon"><div><span>已签命令</span><b>3 / 3</b></div><div><span>自报需要修正</span><b>${r.decisions.filter(d=>d.selfCheck==='revise').length} 幕</b></div><div><span>已写复盘</span><b>${r.decisions.filter(d=>d.reflection.trim()).length} 幕</b></div><div><span>文字判断质量</span><b>待教练复核</b></div></div>${r.decisions.map((d,k)=>{let s=E.scenes[k],o=s.options.find(x=>x.id===d.option);return `<article class="history-card"><span class="eyebrow">${s.eyebrow}</span><h3>${esc(o.name)} <span class="pill">把握 ${d.confidence}%</span></h3><p><b>你的理由：</b>${esc(d.reason)}</p><p><b>改变条件：</b>${esc(d.stop)}</p><div class="margin-note"><b>这条路线的检验：</b>${o.test}</div><p><b>你的修正：</b>${esc(d.reflection||'未填写，不推断你已掌握。')}</p><details><summary>重看本幕历史与解释</summary><p>${s.actual}</p><p>${s.why}</p></details></article>`}).join('')}<section class="paper" style="margin-top:30px"><div class="eyebrow">只带走一个动作 / 回到你自己的城市</div><h2 style="margin-top:12px">给下一笔真实投入，写下改变条件。</h2><p style="margin-top:15px">从城市拓展、渠道补贴或小额项目中选一项。写清：准备投入什么，看到什么证据就追加，看到什么就停止。只用你能够承受损失的试验规模。</p><textarea style="margin-top:18px" aria-label="唯一改进动作" placeholder="我准备在……投入……；若……则追加；若……则停止。" oninput="db.active.action=this.value;save()">${esc(r.action||'')}</textarea><div class="actions"><button class="btn primary" onclick="downloadReport()">下载可阅读复盘 HTML ↓</button><button class="btn" onclick="exportData()">备份记录 JSON ↓</button><button class="btn" onclick="window.print()">打印 / PDF</button><button class="btn" onclick="archive()">归档，返回封面</button></div></section>${sources(E.sources.map(x=>x.id))}${footer()}`}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download('经营者-V4-完整记录.json','application/json',JSON.stringify(db,null,2))}
function downloadReport(){let r=db.active;let content=`<!doctype html><meta charset="utf-8"><title>千团大战 · 我的复盘</title><style>body{max-width:800px;margin:40px auto;padding:20px;font:17px/1.9 system-ui;color:#173039}article{border-top:1px solid #ccc;margin:25px 0;padding:20px 0}h1,h2{line-height:1.4}p{white-space:pre-wrap}</style><h1>千团大战 · 我的决策档案</h1><p>完成于 ${esc(r.completedAt||'未完成')}。此文件可离线阅读，无需任何会员。</p>`;r.decisions.forEach((d,k)=>{let s=E.scenes[k],o=s.options.find(x=>x.id===d.option);content+=`<article><h2>${s.eyebrow} · ${o.name}</h2><p>把握：${d.confidence}%</p><p>我的理由：${esc(d.reason)}</p><p>改变条件：${esc(d.stop)}</p><p>历史动作：${s.actual}</p><p>依据与解释：${s.why}</p><p>路线检验：${o.test}</p><p>我的修正：${esc(d.reflection||'未填写')}</p></article>`});content+=`<h2>唯一改进动作</h2><p>${esc(r.action||'未填写')}</p><h2>交给任意AI或教练</h2><p>请引用我的原话和案例证据，评价财务口径、证据边界、机会成本与停止条件。不得只因和历史选择相同加分，不根据选项推断我的心理。先指出已处理和未处理的风险，最后只留一个改进动作。我的把握不是可结算事件概率，不计算Brier分。</p><h2>资料</h2>`+E.sources.map(x=>`<p>[${x.id}] ${x.date} <a href="${x.url}">${x.title}</a></p>`).join('');download('STR-0001-我的复盘.html','text/html',content)}
function archive(){db.runs.push({...db.active});db.active=null;save();home();scrollStageTop();notify('已归档，可在“我的档案”中重看。')}
function modal(html){$('modal').innerHTML=html+'<div><button class="btn" onclick="$(\'modal\').close()">关闭</button></div>';$('modal').showModal()}

function showRecords(){let old=false;try{old=!!localStorage.getItem('business-command-v2')}catch{}modal(`<h2>我的决策档案</h2><p class="note"><a href="archive-v3.html">打开V3旧版 ↗</a> · <a href="archive-v2.html">打开V2旧版 ↗</a></p><p class="small muted">当前设备 · ${db.runs.length} 份归档 · ${db.active?'1 局进行中':'没有进行中的对局'}</p>${db.runs.map((r,k)=>`<div class="history-card"><b>${esc(new Date(r.startedAt).toLocaleString('zh-CN'))}</b><p>${r.decisions.length}/3 幕 ${r.incomplete?'· 未完成归档':''}</p><button class="btn" onclick="loadRun(${k})">打开记录</button></div>`).join('')}<div class="actions"><button class="btn" onclick="exportData()">导出全部记录</button>${old?'<button class="btn" onclick="exportLegacy()">导出旧版V2记录</button>':''}</div><p class="note">导入会合并历史，并优先保留当前进行中的对局；不会覆盖旧版V2记录。</p><label class="small" for="backup">恢复V3/V4备份</label><input id="backup" type="file" accept=".json,application/json" onchange="importData(this.files[0])">`)}
function loadRun(k){if(db.active){notify('先完成或归档当前对局，再打开旧记录。');return}db.active=JSON.parse(JSON.stringify(db.runs[k]));db.runs.splice(k,1);save();$('modal').close();render()}
function exportLegacy(){let raw=localStorage.getItem('business-command-v2');download('经营者-旧版V2原始备份.json','application/json',raw)}
async function importData(file){if(!file)return;try{if(file.size>5e6)throw Error('文件过大');let v=JSON.parse(await file.text());if(!validDB(v))throw Error('不是有效的V3记录');let ids=new Set([...db.runs.map(r=>r.id),db.active?.id]);for(let r of v.runs){if(!ids.has(r.id)){db.runs.push(r);ids.add(r.id)}}if(v.active&&!ids.has(v.active.id)){if(!db.active)db.active=v.active;else db.runs.push(v.active)}save();$('modal').close();render();notify('备份已合并，现有进度已保留。')}catch(e){notify('未导入：'+e.message)}}
// V4 investigation layer. NPC dialogue is authored, not generated.
function validRun(r){return validRunV3(r)&&(!r.intermission||(r.phase==='desk'&&r.index>0&&r.index<3))&&r.decisions.every(d=>!d.pins||(Array.isArray(d.pins)&&d.pins.every(k=>Number.isInteger(k)&&k>=0&&k<9)))}

function heroArt(){return `<div class="hero-art"><svg viewBox="0 0 600 480" role="img" aria-label="经营决策桌概念插画"><defs><linearGradient id="deskLight" x2="1" y2="1"><stop stop-color="#41636b"/><stop offset="1" stop-color="#172734"/></linearGradient><pattern id="deskGrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#89b8be" opacity=".12" fill="none"/></pattern></defs><g transform="translate(300 230) rotate(-30) skewX(30) scale(1 .8)"><rect x="-180" y="-140" width="380" height="300" rx="15" fill="url(#deskLight)" stroke="#526a71" stroke-width="2"/><rect x="-160" y="-118" width="340" height="260" fill="url(#deskGrid)"/><path d="M-140 80L-80 20 -25 30 20 -70 100 -20 160 -90" fill="none" stroke="#d8b16f" stroke-width="4"/>${[[ -80,20],[-25,30],[20,-70],[100,-20]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="#edbd70" stroke="#253c47" stroke-width="4"/>`).join('')}<rect x="-130" y="-90" width="85" height="60" fill="#6b8788" stroke="#93a5a0"/><path d="M-115 -70H-62M-115 -58H-75" stroke="#d9d5b9" stroke-width="3"/><rect x="35" y="50" width="105" height="65" rx="4" fill="#ae976d"/><path d="M48 65H122M48 78H110M48 91H96" stroke="#4d554e" stroke-width="3"/></g><circle cx="480" cy="84" r="40" fill="none" stroke="#485b63"/><circle cx="480" cy="84" r="25" fill="#1e343f"/><path d="M480 65V84L494 92" stroke="#d8b16f" stroke-width="2" fill="none"/><path d="M120 370L200 330M410 175L480 126" stroke="#54717a" stroke-dasharray="4 6"/></svg><div class="float-card fc1"><small>桌上的争论</small><b>增长，还是兑现承诺？</b></div><div class="float-card fc2"><small>尚未打开的历史</small><b class="gold">你的命令会是什么？</b></div><div class="float-card fc3"><small>经营决策席</small><b>三个角色 · 九条路线</b></div><span class="art-caption">一场由你拍板的商业悬局</span></div>`}
function home(){$('app').innerHTML=`<section class="hero"><div><span class="edition"><i class="dot"></i> 个人商学院 · 商业纪实互动剧场</span><h1>回到关键一刻。<br><em>这次，由你拍板。</em></h1><p>走进真实公司的决策现场。<br>与不同立场的人交谈，找出你相信的证据。<br>在历史揭晓之前，签下自己的命令。</p><div class="actions"><button class="btn primary" onclick="${db.active?'render()':'begin()'}">${db.active?'继续我的调查':'接受任命，进入故事'} <span>↗</span></button><button class="btn" onclick="showTrailer()">这场游戏怎么玩？</button></div><p class="note">首集《千团大战：下一笔钱》 · 三幕约20分钟<br>无需登录 / 无需AI会员 / 可下载离线体验</p></div>${heroArt()}</section><section class="ribbon"><div><span>第一步</span><b>询问NPC，听见不同诉求</b></div><div><span>第二步</span><b>收集证据，形成判断</b></div><div><span>第三步</span><b>拍板，承担你的取舍</b></div><div><span>第四步</span><b>逐幕对照，修正假设</b></div></section><section class="intro"><div><div class="eyebrow">已开放案卷 / STR-0001</div><h2 style="margin-top:14px">千团大战：下一笔钱</h2><p>2011年，你坐进美团经营决策席。消费者已经付款，商户还在等待生意，团队希望拓展更多城市。每一个人都能给你一个花钱的理由。</p><p>但下一笔钱，到底应该买来什么？你要在退款承诺、获客方式与组织建设之间作出三次取舍。未来的答案，此刻还没有打开。</p><div class="actions"><a class="poster-link" href="https://github.com/tonylin231011/business-command" target="_blank" rel="noopener">在 GitHub 查看项目 ↗</a><a class="poster-link" href="library.html">探索原课程与案例库 ↗</a></div></div><aside class="paper"><span class="stamp">角色档案 / 仅包含入局前经历</span><h3 class="serif" style="font-size:25px;margin-top:17px">你有过产品，<br>也失去过机会。</h3><p>人物回顾记载，王兴在美团前经历过校内网出售与饭否停服。[S6] 2010年3月，美团成立。[S2]</p><p>这次，互联网之外还有真实商户、城市团队和需要兑现的服务。你能做成一张更大的经营网络吗？</p></aside></section><section class="chapter-previews">${['一张没有消费的券','钱到账以后','机会来了，谁接得住'].map((t,i)=>`<div class="chapter-preview"><span>0${i+1}</span><h3>${t}</h3><p>${['交易完成了，承诺是否也结束了？','终于有钱，你会按谁的节奏花？','对手慢下来，你的组织准备好了吗？'][i]}</p></div>`).join('')}</section><div class="notice">本集将你熟悉的城市与渠道经营，迁移到真实商业取舍。NPC为虚构角色，对话与备选方案为教学演绎；历史动作另有来源。即时反馈按路线提供，你的自由文字保留给后续教练复核。</div>${footer()}`}
function showTrailer(){modal(`<span class="eyebrow">玩法说明 / 无需熟悉财务术语</span><h2 style="margin-top:14px">先听人说话，再签下命令。</h2><p>每幕有三位NPC。点击人物，选择问题继续交谈，也可以要求出示原始材料。</p><p class="note">遇到值得保留的内容，点击“钉入证据笔记”。你可以改变问话顺序、反复追问，笔记会随对局保存。</p><p class="note">听完三方后进入签批，选择路线、留下理由与改变条件。历史会在提交后逐幕打开。点击继续才进入下一幕。</p><p class="note">没有倒计时、付费道具和“与历史一致就满分”。NPC对话预先编写，离线也能玩。</p>`)}
function investigation(){let d=draft();if(!Number.isInteger(d.npc)||d.npc<0||d.npc>2)d.npc=0;if(!d.talks||typeof d.talks!=='object'||Array.isArray(d.talks))d.talks={};for(let k of Object.keys(d.talks))if(!['0','1','2'].includes(k)||!Array.isArray(d.talks[k]))delete d.talks[k];for(let k in d.talks)d.talks[k]=d.talks[k].filter(x=>Number.isInteger(x)&&x>=0&&x<=2);if(!Array.isArray(d.pins))d.pins=[];d.pins=d.pins.filter(x=>Number.isInteger(x)&&x>=0&&x<9);if(!Number.isInteger(d.question)||d.question<0||d.question>2)d.question=null;return d}
function clueText(s,key){let n=Math.floor(key/3),q=key%3;return s.npcs[n].questions[q].a}
function shortClue(s,key){let t=clueText(s,key);return t.length>72?t.slice(0,72)+'…':t}
function notebookHTML(d,s){return `<h3>⌑ 我的证据笔记 <span class="small muted">${d.pins.length} 条 · 不代表已证明正确</span></h3><div class="clue-chips">${d.pins.length?d.pins.map(i=>`<span class="clue-chip">${esc(shortClue(s,i))}<button aria-label="移除${esc(shortClue(s,i))}" onclick="pinClue(${i})">×</button></span>`).join(''):'<p class="empty">听完一段回答，可以把关键内容钉在这里。观点需要验证，事实也有口径。</p>'}</div>`}
function conversationHTML(d,s){let n=s.npcs[d.npc],asked=d.talks[d.npc]||[],q=d.question;return `<div class="dialogue-top"><h3>${esc(n.name)} <span class="speaker-role">${esc(n.role)} / ${esc(n.interest)}</span></h3><span class="aside">虚构角色 · 编排对话</span></div><p class="speech">${q===null?esc(n.greeting):esc(n.questions[q].a)}</p><div class="question-list">${n.questions.map((x,k)=>`<button class="question ${q===k?'selected':''}" onclick="askNPC(${k})">${asked.includes(k)?'<span class="tick">✓ </span>':''}${esc(x.q)}</button>`).join('')}</div>${q!==null&&asked.length?`<div class="evidence-dock" style="padding:14px 0 0;border:0;background:none"><span class="label">${q===2?esc(n.tag):'对话要点 · 教学分析'}</span><button aria-pressed="${d.pins.includes(d.npc*3+q)}" onclick="pinClue(${d.npc*3+q})">${d.pins.includes(d.npc*3+q)?'✓ 已钉入笔记':'＋ 钉入证据笔记'}</button></div>`:''}`}
function roomHTML(d,s){return `<div class="game-room"><div class="room-head"><span>现场会面 / 点击人物开始询问</span><span class="live-badge"><i class="dot"></i> 已听取 ${d.read.length}/3 方意见</span></div><div class="room-scene">${s.npcs.map((n,i)=>`<button class="npc ${d.npc===i?'active':''}" aria-pressed="${d.npc===i}" aria-label="与${esc(n.role)}${esc(n.name)}交谈" onclick="selectNPC(${i})">${portrait(n,i)}${!(d.talks[i]||[]).length?'<span class="unread">!</span>':''}<span class="nameplate">${esc(n.role)}<span class="npc-name">${esc(n.name)}</span></span></button>`).join('')}</div><div class="dialogue" id="dialogue" aria-live="polite">${conversationHTML(d,s)}</div></div><div class="notebook" id="notebook">${notebookHTML(d,s)}</div>`}
function commandHTML(d,s){return `<div class="command-panel" id="command-panel"><div class="eyebrow">决策时刻 / 三条路线都有代价</div><h2>${s.question}</h2>${s.options.map((o,k)=>`<button class="choice" id="opt${k}" aria-pressed="${d.option===o.id}" onclick="choose(${k})"><span class="letter">${'ABC'[k]}</span><span><strong>${o.name}</strong><p>${o.pitch}</p><small>你要承担 / ${o.cost}</small></span></button>`).join('')}<div class="order"><div class="eyebrow">把理由留在这里，等历史来检验</div><label for="reason">为什么签这条命令？你愿意承担什么代价？</label><textarea id="reason" placeholder="不用写报告，像你在真实会议上拍板那样说。" oninput="writeDraft('reason',this.value)">${esc(d.reason)}</textarea><label for="stop">看到什么具体变化，你会改变命令？</label><textarea id="stop" placeholder="留下一条会让你改变主意的条件。" oninput="writeDraft('stop',this.value)">${esc(d.stop)}</textarea><label for="confidence">这次，你有多大把握？ <output id="confidenceOut">${d.confidence}%</output></label><input id="confidence" type="range" min="0" max="100" step="5" value="${d.confidence}" aria-label="决策把握百分比" oninput="writeDraft('confidence',Number(this.value));$('confidenceOut').textContent=this.value+'%'"><div class="range-row muted"><span>尚在试探</span><span>较有把握</span><span>非常确定</span></div><p class="note">把握为自报判断，不直接计算校准分。你的证据笔记会和命令一起归档。</p><div class="status" id="formstatus" role="status"></div><button class="btn primary" onclick="commit()">封存命令，揭开这一幕 ↗</button></div></div>`}
function desk(){let r=db.active,s=E.scenes[r.index],d=investigation();save();$('app').innerHTML=shell(`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lede">${s.scene}</p><p class="tension">${s.tension}</p>${roomHTML(d,s)}<div class="desk-actions"><p>${d.read.length<3?'先询问三方，再回到自己的决策位置。':'三方意见已听取。你可以继续追问，也可以开始签批。'}</p><button class="btn primary" onclick="openCommand()">${d.orderOpen?'回到签批 ↓':'我准备好拍板了 →'}</button></div>${d.orderOpen?commandHTML(d,s):''}<details><summary>这段对话的历史与教学边界</summary><p class="note">NPC姓名、形象与对话为虚构，呈现不同经营诉求；不冒充真实高管原话。每幕原始材料保留事实与来源。历史选择只在你提交之后揭晓。</p></details>`)}
function selectNPC(i){let d=investigation();d.npc=i;d.question=null;save();let s=E.scenes[db.active.index];$('dialogue').innerHTML=conversationHTML(d,s);document.querySelectorAll('.npc').forEach((n,k)=>{n.classList.toggle('active',k===i);n.setAttribute('aria-pressed',k===i)})}
function askNPC(k){let d=investigation();d.question=k;let a=d.talks[d.npc]||(d.talks[d.npc]=[]);if(!a.includes(k))a.push(k);if(!d.read.includes(d.npc))d.read.push(d.npc);save();let s=E.scenes[db.active.index];$('dialogue').innerHTML=conversationHTML(d,s);document.querySelector('.live-badge').innerHTML='<i class="dot"></i> 已听取 '+d.read.length+'/3 方意见';let marker=document.querySelectorAll('.npc')[d.npc].querySelector('.unread');if(marker)marker.remove();document.querySelector('.desk-actions p').textContent=d.read.length===3?'三方意见已听取。你可以继续追问，也可以开始签批。':'先询问三方，再回到自己的决策位置。'}
function pinClue(i){let d=investigation();if(!(d.talks[Math.floor(i/3)]||[]).includes(i%3))return;d.pins=d.pins.includes(i)?d.pins.filter(x=>x!==i):[...d.pins,i];save();let s=E.scenes[db.active.index];$('notebook').innerHTML=notebookHTML(d,s);$('dialogue').innerHTML=conversationHTML(d,s)}
function openCommand(){let d=investigation();if(d.read.length<3){notify('还有人没有发言。点击另外的角色，至少问一个问题。');return}d.orderOpen=true;save();desk();$('command-panel').scrollIntoView({behavior:'smooth',block:'start'})}
const coreRender=render;render=function(){if(db.active?.intermission){interlude();scrollStageTop();return}coreRender()};
const coreAdvance=advance;advance=function(){let r=db.active;r.decisions[r.index].reviewedAt=new Date().toISOString();r.index++;r.phase=r.index===3?'report':'desk';if(r.index===3)r.completedAt=new Date().toISOString();else r.intermission=true;save();render()};
function interlude(){let r=db.active,s=E.scenes[r.index],prev=E.scenes[r.index-1];$('app').innerHTML=`<section class="interlude"><div class="mail">⌁</div><span class="eyebrow">幕间来信 / 历史继续向前</span><h1>${r.index===1?'一笔新钱，\n送来新的争论。':'一条消息，\n让所有人重新盘算。'}</h1><p>${prev.bridge}</p><span class="stage-mark">下一幕 · ${s.date}</span><div class="actions"><button class="btn primary" onclick="enterNextScene()">打开来信，进入下一幕 →</button></div><p class="note" style="font-size:12px;margin-top:25px">你的命令已保存。下一幕按真实时间推进。</p></section>${footer()}`}

function reveal(){revealV3();let r=db.active,d=r.decisions[r.index],s=E.scenes[r.index];let seal=document.querySelector('.seal');if(d.pins?.length){let box=document.createElement('div');box.className='notebook';box.innerHTML='<h3>你签批时带进来的证据</h3><div class="clue-chips">'+d.pins.filter(i=>Number.isInteger(i)&&i>=0&&i<9).map(i=>'<span class="clue-chip">'+esc(shortClue(s,i))+'</span>').join('')+'</div>';seal.after(box)}let p=document.querySelector('.progress');if(p)p.setAttribute('aria-label','当前为第'+(r.index+1)+'幕揭晓')}

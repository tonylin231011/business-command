<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经营者 · 商业决策沙盘</title><style>
:root{--bg:#101c1b;--panel:#1a2a28;--line:#35504b;--ink:#e8eee5;--muted:#9fb3a9;--gold:#edc77b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 system-ui,'Microsoft Yahei',sans-serif}header{padding:20px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}a{color:var(--gold)}main{max-width:1160px;padding:40px 30px;margin:auto}.kicker{letter-spacing:3px;color:var(--gold);font-size:12px}h1{font-size:clamp(32px,5vw,60px);line-height:1.2}h2{font-size:28px}h3{font-size:20px}.muted{color:var(--muted)}button{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:12px 20px;cursor:pointer}button:hover,button.selected{border-color:var(--gold);background:#374037}button.primary{background:var(--gold);color:#172521;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.panel{padding:26px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:22px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.option{text-align:left;display:block;min-height:210px}.option strong{font-size:20px;display:block;margin-bottom:12px}.option small{display:block;color:var(--muted);margin-top:16px}label{display:block;margin:16px 0}input,textarea{font:inherit;background:#0e1c19;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:12px}input[type=number]{width:110px}textarea{width:100%;min-height:90px}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.timeline{display:flex;gap:12px}.timeline span{height:5px;flex:1;background:var(--line)}.timeline span.done{background:var(--gold)}.fact{border-left:2px solid var(--gold);padding-left:16px;margin:18px 0}.tag{color:var(--gold);font-size:12px}details{margin-top:20px}summary{cursor:pointer}footer{margin:40px 0;color:var(--muted);font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:760px){main{padding:25px 18px}.grid{grid-template-columns:1fr}.option{min-height:auto}table{font-size:13px}}
</style><header><strong>经营者 / BUSINESS COMMAND</strong><nav><a href="library.html">进入案例与学习档案 ↗</a>　<button onclick="exportAll()">导出战绩</button></nav></header><main id="app"></main><script>
const E={"id": "STR-0001", "version": 1, "title": "千团大战 · 活到下一轮", "subtitle": "2011 / 中国本地生活 / 三幕历史决策沙盘", "role": "你受命进入美团的经营决策席。你承担类似王兴的资源取舍职责；以下决策菜单为编辑设计，不是当年会议实录。", "sources": [{"id": "S1", "date": "2011-03-14", "title": "北京商报：过期包退计划（同期报道）", "url": "https://finance.ifeng.com/news/special/2011315/20110314/3655793.shtml"}, {"id": "S2", "date": "2011-07-07", "title": "新浪科技：B轮融资发布会（同期采访）", "url": "https://tech.sina.com.cn/i/2011-07-07/11005745178.shtml"}, {"id": "S3", "date": "2011-07-07", "title": "经济观察网：融资与广告策略（同期采访）", "url": "https://www.eeo.com.cn/2011/0707/205540.shtml"}, {"id": "S4", "date": "2011-11-11", "title": "新浪科技：IPO延迟（消息来源含匿名人士，原因未获独立证实）", "url": "https://tech.sina.com.cn/i/2011-11-11/09216306701.shtml"}, {"id": "S5", "date": "2012-06-21", "title": "北京青年报：拉手6月19日撤销申请", "url": "https://msn.finance.sina.com.cn/gdxw/20120621/0000998863.html"}, {"id": "S6", "date": "2014-02-21", "title": "王兴十年（回顾性人物报道，清华校友总会转载）", "url": "https://www.tsinghua.org.cn/info/1014/11230.htm"}], "scenes": [{"date": "2011-03-14", "title": "第一幕：信任的代价", "dispatch": "一份退款公告放在桌上。行业习惯将未消费的过期券留在平台。你的团队已经宣布返还这部分余额。增长团队仍在争取投入，财务需要知道你接下来优先守住什么。", "facts": ["美团已宣布过期包退，涉及此前未消费款项1000余万元人民币。[S1]", "本幕不提供真实现金余额、净烧钱速度或现金跑道；公开材料不足。"], "sourceIds": ["S1"], "question": "既定退款承诺已经存在，下一阶段你把哪个目标放在首位？", "options": [{"id": "growth", "name": "扩大触达", "text": "优先新增用户与城市触达；接受短期获客支出压力。", "tradeoff": "需要证明新增客户能留下来，并核对现金支出。"}, {"id": "trust", "name": "兑现服务", "text": "优先退款兑现、客户解释与商户交付；限制同期新增项目。", "tradeoff": "服务改善未必立刻带来规模，机会窗口也会收窄。"}, {"id": "reserve", "name": "保留选择", "text": "优先现金盘点、收支预测与储备；分阶段批准新增投入。", "tradeoff": "等待信息也有成本，谨慎可能错过优质商户。"}], "budgetLabel": "用100枚教学资源筹码表达本幕投入强度（不是公司真实现金）", "prediction": "在2011年7月底之前，美团是否会宣布完成新一轮融资？", "outcome": true, "resolution": "2011年7月7日，发布会宣布B轮5000万美元到账。[S2]", "history": "过期退款是本幕开始前已经公布的承诺，不是你选择后才发生。资料不足以还原当时所有预算讨论。"}, {"date": "2011-07-07", "title": "第二幕：钱到了，仗怎么打", "dispatch": "新一轮融资已宣布完成。各条战线都在申请资源。这一刻，融资额是已知，下一轮融资是否容易仍是未知。请给出你愿意承担的投入节奏。", "facts": ["B轮融资5000万美元已到账；同期报道转述首轮资金尚未使用。[S2]", "截至5月底，开站接近100城，员工1800多人，均为当时公司披露口径。[S2]", "融资金额不是可自由支配现金余额，缺少商户结算、退款义务和净流出数据。"], "sourceIds": ["S2"], "question": "面对扩张需求，你选择哪条主路线？", "options": [{"id": "ads", "name": "集中买曝光", "text": "把新增投入集中于品牌与广告触达，争取先形成用户规模。", "tradeoff": "需要持续监测获客成本和复购，防止流量未转成经营贡献。"}, {"id": "service", "name": "经营能力优先", "text": "把新增投入放在服务、技术和人才，按城市表现逐步追加。", "tradeoff": "建设周期较长，对手可能先抢走显眼位置。"}, {"id": "cash", "name": "延长储备", "text": "降低新增承诺，先守结算和退款能力，再等待行业变化。", "tradeoff": "现金更充裕，但竞争位置也可能下降。"}], "budgetLabel": "本幕教学投入强度：0—100枚筹码（各幕独立，不模拟历史财务）", "prediction": "未来12个月内，拉手网会完成赴美IPO挂牌吗？", "outcome": false, "resolution": "2012年6月报道：拉手已于6月19日撤销上市申请。[S5]", "history": "同期采访报道美团不准备加入广告烧钱战；发布会列出的资金用途包括服务、技术、人才。[S2/S3] 这是主张与方向证据，不足以证明这些选择单独导致胜出。"}, {"date": "2011-11-11", "title": "第三幕：寒意先到", "dispatch": "关于拉手IPO推迟的消息传到经营席。注意，它还没有被正式撤回。你的决定必须适用于“对手很快重启”与“窗口长期关闭”两种情景。", "facts": ["当日媒体报道拉手暂停路演并推迟IPO，仍有重启可能。[S4]", "报道含匿名消息，关于会计问题及举报原因的说法不能视为已定论。[S4]", "没有可靠证据证明某个核心城市出现补贴翻倍或商户独家买断，本局不加入这些桥段。"], "sourceIds": ["S4"], "question": "你如何把融资风险转化为下一阶段的行动？", "options": [{"id": "expand", "name": "加速抢位", "text": "趁对手不确定，争取商户与人才；设定投入上限和停止条件。", "tradeoff": "机会可能短暂，也可能把自己拖入不可逆支出。"}, {"id": "hold", "name": "守住经营", "text": "优先结算、退款与履约，放慢新增城市，保留机动资金。", "tradeoff": "更能承受坏情景，也可能让出份额。"}, {"id": "org", "name": "补齐组织", "text": "把优先级交给区域管理、销售质量与流程，扩张按能力放行。", "tradeoff": "组织投入见效慢，需要承担管理变革成本。"}], "budgetLabel": "本幕教学投入强度：0—100枚筹码", "prediction": null, "history": "回顾性报道记载：干嘉伟于2011年11月16日加入，随后调整区域管理体系。[S6] 这是事后资料，不能提前作为本幕情报。公开材料不足以确认当时是否正式比较过菜单中的所有方案。"}], "debrief": "本局不是平行宇宙收益预测。你的选择会留下不同的资源与风险承诺，下一幕仍按真实历史时间推进。未建模的利润与市占率不会凭选择生成。训练目标：把现金义务、投入强度、证据限制和行动触发器连成决策。", "transfer": "映射到区域运营：司机供给、商户交付、补贴拉量与城市扩张争夺同一份资源。写出一个你现在业务里可以用明确停止线约束的小额试验。"};const KEY='business-command-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{runs:[],active:null}}catch{state={runs:[],active:null}}let choice=null,entered=Date.now();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('保存失败，请立即导出战绩')}}
function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:2,episode:E.id,...state},null,2)],{type:'application/json'}));a.download='商业沙盘战绩.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function restore(file){if(!file)return;file.text().then(t=>{let d=JSON.parse(t);if(d.schemaVersion!==2||!Array.isArray(d.runs)||d.episode!==E.id)throw Error('格式不匹配');if(d.active&&(!Array.isArray(d.active.decisions)||d.active.decisions.length>3))throw Error('进度无效');if(confirm('恢复将覆盖本机沙盘战绩，请先导出。继续？')){state={runs:d.runs,active:d.active};save();render()}}).catch(e=>alert('恢复失败：'+e.message))}
function begin(){state.active={id:Date.now().toString(),episode:E.id,version:E.version,startedAt:new Date().toISOString(),decisions:[]};choice=null;entered=Date.now();save();render()}
function home(){document.getElementById('app').innerHTML=`<div class="kicker">沉浸式商业案例 · 首集体验版</div><h1>经营者，<br>这一次由你拍板。</h1><p class="muted">封存未来的信息，进入真实的商业关口。选择路线、承诺资源、押上判断，然后对照历史。</p><div class="panel"><span class="tag">STR-0001 · 战略 / 运营 / 资本</span><h2>千团大战 · 活到下一轮</h2><p>2011年，团购行业拥挤而躁动。你坐进美团经营决策席。新钱、退款承诺与销售组织，将三次考验你的选择。</p><div class="row"><button class="primary" onclick="begin()">接受任命 →</button>${state.active?'<button onclick="render()">继续本局</button>':''}</div><p class="muted">约10分钟 / 三幕 / 两项可结算预测 / 无倒计时强迫</p></div><div class="grid"><div class="panel"><span class="tag">01 / 已可体验</span><h3>千团大战</h3><p>资金、信任与组织如何排兵布阵。</p></div><div class="panel"><span class="tag">02 / 待核验</span><h3>Managed by Q</h3><p>扩城市、加品类还是做密度？待补完整历史结果后开放。</p></div><div class="panel"><span class="tag">03 / 待核验</span><h3>平台收入的第二条路</h3><p>招聘冻结时，向哪端收费？不以虚构结局凑集数。</p></div></div><details><summary>恢复沙盘备份</summary><input aria-label="恢复沙盘备份" type="file" accept=".json" onchange="restore(this.files[0])"></details><footer>这是一集体验版，尚未按“三集齐备”标准开启日更。网页只将未来信息从正常流程隐藏，静态源码无法防止主动查看剧透。记录保存在当前浏览器，须导出备份。</footer>`}
function render(){let r=state.active;if(!r)return home();let i=r.decisions.length;if(i===E.scenes.length)return report();let s=E.scenes[i];choice=null;entered=Date.now();document.getElementById('app').innerHTML=`<div class="row"><button onclick="home()">← 指挥席</button><span class="kicker">${E.id} / ${s.date} / 情报截止此刻</span></div><h1>${s.title}</h1><div class="timeline">${E.scenes.map((_,n)=>`<span class="${n<=i?'done':''}"></span>`).join('')}</div><p class="muted">${i===0?E.role:'真实进程继续推进。你的上一幕选择已封存；本幕不会假装是它造成了历史事件。'}</p><div class="panel"><div class="tag">情报室 / 本幕新增</div><p>${s.dispatch}</p>${s.facts.map(f=>`<div class="fact">${esc(f)}</div>`).join('')}<details><summary>本幕来源与证据</summary>${E.sources.filter(x=>s.sourceIds.includes(x.id)).map(x=>`<p>[${x.id}] ${x.date} <a target="_blank" rel="noopener" href="${x.url}">${x.title}</a></p>`).join('')}</details></div><h2>${s.question}</h2><p class="muted">选项是基于真实经营矛盾设计的教学备选，不声称是当年内部会议提案。</p><div class="grid">${s.options.map((o,n)=>`<button class="option" id="option${n}" onclick="pick(${n})"><strong>${o.name}</strong>${o.text}<small>承担的代价：${o.tradeoff}</small></button>`).join('')}</div><form onsubmit="commit(event)"><div class="panel"><label>${s.budgetLabel}<br><input id="budget" aria-label="教学投入强度" type="number" min="0" max="100" step="1" required placeholder="0—100"></label><label>你的停止条件 / 什么证据会让你改变主意？<textarea id="reason" required minlength="8" placeholder="写一条具体的行动触发器……"></textarea></label>${s.prediction?`<div class="tag">单独押注 / 历史可结算事件</div><p>${s.prediction}</p><label>你认为“会发生”的概率（不是对路线的信心） <input id="prob" type="number" min="0" max="100" required placeholder="0—100"> %</label>`:'<p class="muted">本幕路线没有可验证的二元成败标签，不计算置信度得分。</p>'}</div><button id="commit" class="primary" type="submit" disabled>封存决策，推进时间 →</button></form><footer>筹码是教学表达，不是历史金额；选择不触发伪造的市场份额或利润。自由文本保留给教练评价。</footer>`}
function pick(n){choice=n;document.querySelectorAll('.option').forEach((e,k)=>e.classList.toggle('selected',k===n));document.getElementById('commit').disabled=false}
function commit(ev){ev.preventDefault();if(choice===null)return;let r=state.active,s=E.scenes[r.decisions.length],b=Number(document.getElementById('budget').value),reason=document.getElementById('reason').value.trim(),prob=s.prediction?Number(document.getElementById('prob').value):null;if(!Number.isInteger(b)||b<0||b>100||reason.length<8||prob!==null&&(!Number.isFinite(prob)||prob<0||prob>100))return alert('请核对投入、条件与概率');r.decisions.push({scene:r.decisions.length,option:s.options[choice].id,budget:b,reason,probability:prob,elapsedMs:Date.now()-entered,at:new Date().toISOString()});save();render();window.scrollTo(0,0)}
function report(){let r=state.active;let scored=r.decisions.filter(d=>d.probability!==null),loss=scored.reduce((v,d)=>v+(d.probability/100-Number(E.scenes[d.scene].outcome))**2,0)/scored.length;let pct=Math.round((1-loss)*100);document.getElementById('app').innerHTML=`<div class="kicker">AFTER ACTION REVIEW / ${E.id}</div><h1>战役结束。<br>现在，打开历史档案。</h1><div class="grid"><div class="panel"><div class="tag">预测表现</div><h2>${pct} / 100</h2><p>100 × (1 − 平均Brier损失)</p></div><div class="panel"><div class="tag">样本边界</div><h2>${scored.length} 个事件</h2><p>单局预测表现，不代表已测得稳定校准度。</p></div><div class="panel"><div class="tag">决策质量</div><h2>待教练评议</h2><p>路线重合度不作为正确率；未模拟反事实收益。</p></div></div>${r.decisions.map((d,i)=>{let s=E.scenes[i],o=s.options.find(o=>o.id===d.option);return `<div class="panel"><span class="tag">${s.date}</span><h2>${s.title}</h2><p>你的命令：${o.name} · 教学投入 ${d.budget}/100</p><p>触发器：${esc(d.reason)}</p><p class="muted">本幕停留约${Math.round(d.elapsedMs/1000)}秒（含阅读/离开页面时间，不用于能力评分）。</p>${s.prediction?`<p>你给“发生”${d.probability}%概率；实际：${s.outcome?'发生':'未发生'}。</p><p>${s.resolution}</p>`:''}<h3>历史对照</h3><p>${s.history}</p><p>机会与代价：${o.tradeoff}</p></div>`}).join('')}<div class="panel"><h2>把这仗带回自己的城市</h2><p>${E.transfer}</p><p class="muted">${E.debrief}</p><button onclick="downloadReview()">下载完整教练复盘包</button> <button onclick="finish()">归档战报</button></div><details><summary>史料档案 · 已解锁</summary>${E.sources.map(x=>`<p>[${x.id}] ${x.date} <a href="${x.url}" target="_blank" rel="noopener">${x.title}</a></p>`).join('')}<p>未证实并排除：14个月跑道、10城补贴翻倍、当年某核心城市独家买断。2013份额“过半”涉及具体月份与不同口径，本集不使用该数。</p></details>`}
function downloadReview(){let text='# STR-0001 教练复盘包\n请严评我的决策依据、停止条件和资源取舍。不要因为与历史路线不同就扣分，不用后来结果证明当年必然正确。最后只留一个改进动作。两项预测Brier只算本局表现，不算稳定校准。\n'+JSON.stringify({episode:E,run:state.active},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download='STR-0001-复盘包.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function finish(){if(!state.runs.some(r=>r.id===state.active.id))state.runs.push({...state.active,finishedAt:new Date().toISOString()});state.active=null;save();home()}
home();
</script></html>

<script>
const SEED={"schemaVersion": 1, "cases": [{"id": "C001", "title": "Managed by Q，决策2015-07，案例2016", "level": "A", "topic": "深耕城市、跨城还是加品类？", "url": "https://mitsloan.mit.edu/teaching-resources-library/managed-q", "body": "事实：2015年7月，公司已有纽约、芝加哥、旧金山业务，创始人在现有市场获客、新市场扩张与增加服务间选择。公司同时重视员工投入和技术。案例正文第1—4页提供决策与服务背景。\n\n正文：https://mitsloan.mit.edu/sites/default/files/2024-04/Managed%20by%20Q.pdf\n\n题卡：①只选一个优先增长方向，理由是什么？②你最需要哪两项单位经济性证据？③怎样设置一个不损害现有履约的小试验？\n\n边界：未给可靠CAC、客户留存或跨城固定成本，不能虚构回收期。迁移：取送车业务的城市密度与品类扩张。后续结果暂不揭晓。"}, {"id": "C002", "title": "Quest Diagnostics客服中心，2015，案例2017", "level": "A", "topic": "合并中心后先改人员还是流程？", "url": "https://mitsloan.mit.edu/teaching-resources-library/quest-diagnostics-a-improving-performance-call-centers", "body": "事实：2015年新负责人接手客服业务；此前20个中心合并为两个，存在成本、缺勤、流失与服务问题。来源为官方案例摘要与正文入口。\n\n正文：https://mitsloan.mit.edu/sites/default/files/2024-04/Quest%20Diagnostics%20A.pdf\n\n题卡：①先抓哪个问题，为什么？②什么证据能区分人手不足、流程问题和技能问题？③用什么短周期指标判断行动有无副作用？\n\n边界：中心数量下降本身不能证明效率改善，也不能证明造成所有问题。需补分时来电、处理时长、一次解决率和人员数据。迁移：调度与城市运营支持。"}, {"id": "C003", "title": "interviewing.io，2020冲击，案例2023", "level": "A", "topic": "企业招聘停滞后向哪一端收费？", "url": "https://mitsloan.mit.edu/teaching-resources-library/interviewing-io-reinventing-technical-hiring", "body": "事实：平台让工程师匿名练习面试，由企业为接触合格人才付费；2020年招聘冻结冲击收入。官方页面讨论多边平台与新收入选择。\n\n正文：https://mitsloan.mit.edu/sites/default/files/2025-11/iio.final_.11.03.23_0.pdf\n\n题卡：①你会优先尝试哪种收费对象/产品？②这一选择会怎样影响另一端？③要验证哪条付费意愿假设？\n\n边界：需补展表、实际用户分层和合同条款；不把用户数量当作网络效应已经成立。迁移：司机、渠道、平台之间的补贴与收费。"}, {"id": "C004", "title": "Costco，2024财年业绩", "level": "A", "topic": "会员费和零售业务如何共同创造价值？", "url": "https://investor.costco.com/news/news-details/2024/Costco-Wholesale-Corporation-Reports-Fourth-Quarter-and-Fiscal-Year-2024-Operating-Results/default.aspx", "body": "事实：2024财年披露净销售额249,625百万美元、会员费4,828百万美元；比较年度分别为52周和53周，周期不完全相同。\n\n题卡：①会员费为什么可能影响零售定价？②还需要什么资料才能判断会员模式是否值得复制？③选一个适合/不适合会员制的本地服务并说明理由。\n\n边界：会员费收入不能直接等同会员业务净利润；两期增速需注意周数；不得依据会员费与公司利润的简单对比就宣称“全部利润来自会员”。需要续费、服务成本和客户行为证据。迁移：服务包月与订阅。"}, {"id": "C005", "title": "Uber，2023全年，2024披露", "level": "A", "topic": "盈利改善有多少可持续？", "url": "https://investor.uber.com/news-events/news/press-release-details/2024/Uber-Announces-Results-for-Fourth-Quarter-and-Full-Year-2023/default.aspx?os=io", "body": "事实：2023年营业利润1,110百万美元，归属公司净利润1,887百万美元；披露全年股权投资重估带来税前净收益约1,600百万美元。数据出自2024年发布的全年业绩。\n\n题卡：①怎样描述盈利改善而不夸大？②你会优先核实哪两项现金流/运营证据？③若要评估新城市投入，还缺什么？\n\n边界：税前重估收益不能直接从税后净利润相减得到精确经营净利润。现金流、调整后EBITDA与营业利润分别核对。迁移：平台业务的经营改善与财务口径。"}, {"id": "C006", "title": "瑞幸，2023Q4，2024-02-23披露", "level": "A", "topic": "高增长和利润率下滑同时出现时怎样配置资源？", "url": "https://investor.lkcoffee.com/news-releases/news-release-details/luckin-coffee-inc-announces-fourth-quarter-and-full-year-2023/", "body": "决策信息截止：2024-02-23。身份：在该日参与经营讨论的分析负责人。下表为公司披露的季度事实，不是模拟数据；单位人民币百万元。\n\n| 指标 | 2022Q4 | 2023Q4 |\n|---|---:|---:|\n| 总净收入 | 3,695.0 | 7,065.0 |\n| 自营店收入 | 2,697.1 | 5,103.4 |\n| 自营店店面经营利润 | 581.5 | 690.4 |\n| 自营店店面经营利润率 | 21.6% | 13.5% |\n\n2023Q4自营同店销售增长13.5%。注意：同店指标、自营收入与集团总收入不是同一口径；店面利润不等于集团净利润。\n\n教学决策情景（原创假设，不声称公司当时提出过该动议）：有人建议下一季度继续大幅增加开店与获客预算，认为增长已经证明模式成功。\n\n三个问题：\n1. 给出最重要的两条经营判断，并用计算支持；分别标注事实和推断。\n2. 对增加预算，你选择全面推进、分范围推进、有限验证还是暂缓？给出依据，不能只以“数据不够”结束。\n3. 只能追加一项分析，你选什么？什么结果会改变你的决定？\n\n边界：表中不能确定降价、门店成熟度、竞争或成本各贡献多少；不能用收入增长直接推断投资回报。评分重点为口径、证据、取舍与调查区分力，回答前不提示算法。"}, {"id": "C007", "title": "Amazon，1997股东信", "level": "A", "topic": "怎样区分长期投入与无纪律扩张？", "url": "https://www.aboutamazon.com/news/company-news/amazons-original-1997-letter-to-shareholders", "body": "事实：1997股东信报告销售额147.8百万美元、增长838%，并把客户重复购买、品牌与长期市场地位放在重要位置。材料是管理层对策略的说明，不是独立因果证据。\n\n题卡：①在不知道后续成功的前提下，哪些信息支持继续投入？②哪些未知会使你反对？③为一个早期项目设计资本上限与里程碑。\n\n边界：不能因为后来成功就推断当年每项投入合理。需要成本、现金消耗、竞争和留存证据。迁移：AI产品和第二曲线的小额长期试验。"}, {"id": "C008", "title": "Ferrari in 2025，案例2025", "level": "B", "topic": "增长是否损害稀缺性，电动化如何投入？", "url": "https://mitsloan.mit.edu/teaching-resources-library/ferrari-2025-balancing-tradition-and-innovation-to-grow", "body": "本条目已定位官方来源，需由教练补读正文后再生成训练。请勿仅凭摘要生成真实财务数据。"}, {"id": "C009", "title": "Boeing 737 MAX，201 ，2024披露", "questions": ["如何描述盈利改善而不夸大？", "优先核实哪些现金流和运营证据？", "判断新城市投入还缺什么？"]}, {"id": "MBA-007", "caseId": "C007", "title": "Amazon，1997股东信", "questions": ["不知道后续成功时，哪些证据支持投入？", "哪些未知会让你反对？", "设计一个早期项目的资本上限与里程碑。"]}]}, CURRICULUM="# 个人 MBA：课程与真实商业案例知识库 V1\n\n建立：2026-11-06（北京时间）。性质：个人案例制商业训练，不授予学位，不代表院校认证或完整替代 MBA。\n\n## 1. 目标与使用方式\n\n上位目标：积累可迁移的经营判断能力，以证据支持商业决策。\n\n两条主线：商业嗅觉——识别客户为何付钱、供需变化、竞争结构和可验证的机会；投资思维——判断增量现金流、资本需求、机会成本、下行风险与退出条件。\n\n先读“课程与训练规则”；每日只做一张题卡。案例目录供教练选题，不要求学员一次读完。每张题卡最多三个问题，先作答再讲解。资料的检索与整理由教练承担。\n\n这是首批可扩充知识库，不宣称穷尽 MBA 课程或已经精读全部案例。30 个案例条目中，7 个已整理为基于已核实片段的入门训练卡，其余23个是带来源的候选条目；完整案例分析前仍须补读相应正文和附件。\n\n## 2. 学员起点\n\n以学习者实际答卷建立基线，不预设能力与学习经历。\n\n## 3. 官方课程与公开教学来源\n\n以下11所机构的课程/教学入口于2026-11-06检索。课程覆盖与本计划的对应是教练设计，不是这些学校的联合课程。公开课程说明不等于已经取得完整课程材料。\n\n| 机构 | 本次核实范围 | 用于本训练的方向 | 官方来源 |\n|---|---|---|---|\n| Harvard Business School | MBA必修课程页面 | 会计、金融、战略、运营、组织、创业、商业责任 | https://www.hbs.edu/mba/academic-experience/curriculum |\n| Wharton | MBA核心与选修结构 | 管理经济学、营销、统计、金融、沟通 | https://mba.wharton.upenn.edu/mba-curriculum/ |\n| MIT Sloan | 核心及部分选修说明、案例目录 | 数据决策、组织过程、财务、运营、竞争策略 | https://mitsloan.mit.edu/mba/mba-course-descriptions |\n| Stanford GSB | 官方课程检索结果；部分页面访问403，以官方Bulletin补充 | 领导、分析、管理基础 | https://bulletin.stanford.edu/programs/GSB-MBA/general-aoYks |\n| CEIBS中欧 | 官方课程说明 | 中国商业环境、会计、营销、组织、战略 | https://www.ceibs.edu/mba/curriculum |\n| 清华经管 | 官方MBA必修模块 | 软技能、分析基础、管理基础、中国与世界、整合实践 | https://mba.sem.tsinghua.edu.cn/kchsz/kctx/bxk.htm |\n| INSEAD | 官方核心课程检索结果 | 综合管理、战略、金融与跨文化管理选题 | https://www.insead.edu/master-programmes/master-business-administration/core-courses |\n| London Business School | 官方核心课程检索结果 | 商业基础、定制核心、应用实践 | https://www.london.edu/masters-degrees/mba/programme-content/core-courses |\n| Columbia Business School | 官方核心课程检索结果 | 估值基础与综合商业分析 | https://academics.business.columbia.edu/mba/academics/core-curriculum |\n| Berkeley Haas | 官方课程页面检索结果 | 分析工具与综合管理；不采用不同页面有分歧的课程数量 | https://haas.berkeley.edu/mba/academics/course-planning/curriculum-outline/ |\n| NYU Stern / Aswath Damodaran | 教师公开在线课程页 | 会计、统计、金融基础、公司金融、估值、投资哲学 | https://pages.stern.nyu.edu/~adamodar/New_Home_Page/onlineclass.htm |\n\n补充入口：MIT OCW https://ocw.mit.edu/courses/res-15-001-mit-sloan-learningedge-fall-2008/ 。历史课程可训练稳定概念；不得把旧制度、旧价格当作今天的条件。\n\n## 4. 24周课程：按表现调整，不按日历自动宣告掌握\n\n| 周次 | 模块 | 核心决策能力 | 可验收产物 |\n|---|---|---|---|\n| 1—2 | 商业模式与客户需求 | 谁付钱、买什么结果、为何现在有机会 | 一页商业模式与证据表 |\n| 3—4 | 会计与利润质量 | 区分规模、利润、现金，识别一次性项目 | 一页利润到现金的解释 |\n| 5—6 | 定价、营销与渠道 | 付费意愿、价格弹性、获客/留存、渠道冲突 | 一个定价试验与退出线 |\n| 7—8 | 运营与供给 | 瓶颈、排班、密度、服务质量、单位经济性 | 一项有成本边界的运营方案 |\n| 9—10 | 战略与竞争 | 行业利润池、护城河、竞争反应、能力边界 | 一份竞争决策备忘录 |\n| 11—12 | 公司金融与资本配置 | 增量现金流、营运资金、回收期、NPV、机会成本 | 一页项目投资建议 |\n| 13—14 | 投资与估值 | 好公司与好价格、情景估值、安全边际 | 有假设区间的企业估值练习 |\n| 15—16 | 组织、激励与谈判 | 指标副作用、委托代理、供应商谈判 | 绩效方案或谈判底线表 |\n| 17—18 | 平台、网络效应与AI | 补贴哪一端、真实留存、AI降本验证 | 可检验的增长/AI投入假设 |\n| 19—20 | 创业与低风险验证 | 小额下注、信息价值、先售后建、停止条件 | 一项可在有限预算内完成的验证 |\n| 21—22 | 宏观、治理与危机 | 情景压力、杠杆、合规、利益冲突 | 风险情景及行动触发器 |\n| 23—24 | 综合资源配置 | 在多个好项目中取舍；考虑时间与家庭约束 | 第二曲线或本职业务决策备忘录 |\n\n内容广度在24周轮转，难度从当前水平起步。会计、现金流、估值不在第一天一次塞入；每次只增加一个主要难点。\n\n建议案例配比（设计目标，非当前库存比例）：中国/亚洲至少40%；服务与平台至少30%；小企业或可迁移到小规模业务至少25%；失败、收缩或有争议结果至少25%。比例可重叠。当前库偏海外商学院，后续优先补中国案例与小企业失败案例。\n\n## 5. 每日培训机制\n\n默认北京时间晚间约19:00，每天15—20分钟；周一缩为5—10分钟，避免与原每周数据技能练习叠加太重。原任务保持独立，MBA不默认重复Excel/SQL操作题。\n\n- 周一：商业观察/机会辨认，最多两问。\n- 周二：真实财务数据与资源投入。\n- 周三：营销、定价或竞争决策。\n- 周四：运营、组织、谈判轮换。\n- 周五：投资委员会，做出投/不投/小额验证的明确选择。\n- 周六：一周核心案例的反方挑战或第二阶段新信息。\n- 周日：5—10分钟迁移复测，仅复测已经作答的内容；没有已完成题则做轻量新题。\n\n每日结构：一句战略关联 → 决策日期与角色 → 可核实事实/数据 → 最多三个问题 → 作答后评分与复盘。\n\n缺课规则：不默认已掌握，不连续催补。优先维持一个主案例，未答时提供其独立小问题；连续多次未答则减量，不堆积七张待办。\n\n## 6. 教学与评分约束\n\n1. 作答前不公布答案、评分或关键解题线索；完整答卷后才点评。用户明确要求提示或示范时可给，但标注辅助程度。\n2. 每题事先指定2—4个评价维度；不因选“暂缓”就加分。证据扎实的推进、小试、拒绝均可高分。\n3. 通用五维各0—4分：问题/机会定义、证据与因果、量化与口径、取舍与风险、验证与行动。未考察维度标N/A并按实际满分报告。\n4. 0=缺失或核心错误；1=提到但无支持；2=基本正确有关键遗漏；3=完整且可执行；4=还能处理替代解释、敏感性和证据限制。评分必须引用学员答案中的具体依据。\n5. 反馈顺序：明确判断 → 错误和遗漏 → 教练示范 → 与历史短板对照 → 只留一个改进动作。\n6. 教练示范是分析方案，不冒充院校教学指南。真实公司的实际选择只是观察到的结果，不是唯一正确答案；结果好也可能有运气。\n7. 对“收集更多信息”，追问哪条信息可能改变决定、获取成本、期限；不能用无限调查逃避决策。\n8. 每4周安排无提示综合题；在约7天、30天后做异行业迁移复测，按已完成情况安排。\n9. 不把利润直接当作投资现金流。先教清静态回收，再逐步加入税、营运资金、维护性资本支出、残值和折现。\n10. 本训练的投资题用于商业判断，不自动转化为真实买卖指令。\n\n## 7. 知识库字段与证据规则\n\n每个条目记录：ID、公司、来源、事件/决策日期、发布日期、检索日、行业、模块、难度、访问状态、已核实事实、未知项、题卡、后续结果来源、学员答案、反馈、复测。\n\n状态：\n- A：已读取原始披露/案例正文中的必要片段，足以支持“该题限定范围”；不等于已精读整个企业。\n- B：已核实官方案例页或目录摘要，尚需正文/附件才能出完整量化题。\n- C：已定位原始报告/官方检索摘要，但关键口径未完成核验，不能直接拿检索数字出题。\n\n事实、管理层主张、教练假设、教学模拟必须分开。模型测算产生的新数字要标“由原始数据计算”，新增情景参数要标“教学假设”。每次使用财报重新核对单位、周期、币种、合并/分部口径、GAAP/非GAAP及定义。\n\n案例采用原创短摘要与题目，保留来源链接；不复制整本教材、付费案例或受限教师手册。免费可读不等于可随意改编全文。信息截止日后的资料仅放复盘阶段。企业披露是第一手证据但存在管理层视角，因果结论仍需检验。\n\n## 8. 首批真实案例索引（30个）\n\n表中“训练问题”均为教练设计，不能当作已核实事实或学校原题。所有条目检索日为2026-11-06。\n\n| ID | 案例与事件/资料时点 | 状态 | 训练问题/用途 | 来源 |\n|---|---|---|---|---|\n| C001 | Managed by Q，决策2015-07，案例2016 | A | 深耕城市、跨城还是加品类？ | https://mitsloan.mit.edu/teaching-resources-library/managed-q |\n| C002 | Quest Diagnostics客服中心，2015，案例2017 | A | 合并中心后先改人员还是流程？ | https://mitsloan.mit.edu/teaching-resources-library/quest-diagnostics-a-improving-performance-call-centers |\n| C003 | interviewing.io，2020冲击，案例2023 | A | 企业招聘停滞后向哪一端收费？ | https://mitsloan.mit.edu/teaching-resources-library/interviewing-io-reinventing-technical-hiring |\n| C004 | Costco，2024财年业绩 | A | 会员费和零售业务如何共同创造价值？ | https://investor.costco.com/news/news-details/2024/Costco-Wholesale-Corporation-Reports-Fourth-Quarter-and-Fiscal-Year-2024-Operating-Results/default.aspx |\n| C005 | Uber，2023全年，2024披露 | A | 盈利改善有多少可持续？ | https://investor.uber.com/news-events/news/press-release-details/2024/Uber-Announces-Results-for-Fourth-Quarter-and-Full-Year-2023/default.aspx?os=io |\n| C006 | 瑞幸，2023Q4，2024-02-23披露 | A | 高增长和利润率下滑同时出现时怎样配置资源？ | https://investor.lkcoffee.com/news-releases/news-release-details/luckin-coffee-inc-announces-fourth-quarter-and-full-year-2023/ |\n| C007 | Amazon，1997股东信 | A | 怎样区分长期投入与无纪律扩张？ | https://www.aboutamazon.com/news/company-news/amazons-original-1997-letter-to-shareholders |\n| C008 | Ferrari in 2025，案例2025 | B | 增长是否损害稀缺性，电动化如何投入？ | https://mitsloan.mit.edu/teaching-resources-library/ferrari-2025-balancing-tradition-and-innovation-to-grow |\n| C009 | Boeing 737 MAX，2018—2019，案例2023 | B | 激励、信息上报与安全治理 | https://mitsloan.mit.edu/teaching-resources-library/boeings-737-max-8-disasters |\n| C010 | PayPal员工财务健康，案例2022 | B | 无法精确计算NPV时如何作出人员投资决定？ | https://mitsloan.mit.edu/teaching-resources-library/paypal-and-financial-wellness-initiative |\n| C011 | Mud Bay，2014—2017，案例2019 | B | 人员投入如何与运营方式配套？ | https://mitsloan.mit.edu/teaching-resources-library/mud-bays-good-jobs-journey |\n| C012 | Toyota供应商关系，案例2017 | B | 供应商问题应压价、替换还是共同改善？ | https://mitsloan.mit.edu/teaching-resources-library/toyota-supplier-relations-fixing-suprima-chassis |\n| C013 | ESPN，案例2024 | B | 老业务现金流与新渠道转型 | https://mitsloan.mit.edu/teaching-resources-library/espn-navigates-a-new-world-order |\n| C014 | Athletes Unlimited，案例2023 | B | 新市场商业模式与多方利益 | https://mitsloan.mit.edu/teaching-resources-library/athletes-unlimited-innovating-professional-sports-and-empowering-players |\n| C015 | 美国女足联赛NWSL，案例2021 | B | 危机中的组织信任和增长选择 | https://mitsloan.mit.edu/teaching-resources-library/national-womens-soccer-league-a-navigating-uncertainty-building-future |\n| C016 | Netflix Goes to Bollywood，案例2021 | B | 国际扩张与本地化授权 | https://mitsloan.mit.edu/teaching-resources-library/netflix-goes-to-bollywood |\n| C017 | Formula 1，案例2020 | B | 内容、受众与商业化的关系 | https://mitsloan.mit.edu/teaching-resources-library/formula-1-unleashing-greatest-spectacle-planet |\n| C018 | SELCO，事件截止日待正文确认 | B | 低收入客户的需求、支付能力和渠道 | https://som.yale.edu/case-studies/approach/sample-cases |\n| C019 | Design at Mayo，2000年代初 | B | 服务体验如何实验验证？ | https://som.yale.edu/case-studies/approach/sample-cases |\n| C020 | Project M / iTEACH，2006起 | B | 公益目标如何转为可执行服务模式？ | https://som.yale.edu/case-studies/approach/sample-cases |\n| C021 | Teach for All，2011场景 | B | 跨地区复制与本地适应 | https://som.yale.edu/case-studies/approach/sample-cases |\n| C022 | 美团，2023全年，2024披露 | C | 平台业务增长如何落实为现金回报？ | https://www.meituan.com/news/NN240322064007784 |\n| C023 | 途虎，2023年报 | C | 工场店网络、利润质量与车后服务协同 | https://www.hkexnews.hk/listedco/listconews/sehk/2024/0425/2024042500917_c.pdf |\n| C024 | Cisco in 2026: Re-Rating and Reinvention，SM417 | B | 成熟硬件企业如何重构增长？ | https://www.gsb.stanford.edu/faculty-research/publications/case-studies |\n| C025 | Savannah Informatics: When Growth Stalls，2024场景，SM420 | B | 交易量上涨为何未必带动收入增长？ | https://www.gsb.stanford.edu/faculty-research/publications/case-studies |\n| C026 | Nike: Going Direct 2017—2024，SM419 | B | 直营渠道与渠道伙伴如何取舍？ | https://www.gsb.stanford.edu/faculty-research/publications/case-studies |\n| C027 | The Voice of AI: Turning It Up to Eleven，E964 | B | AI产品付费、增长与资本需要；数值待正文核验 | https://www.gsb.stanford.edu/faculty-research/publications/case-studies |\n| C028 | Aging Care with Seniorly，E945 | B | 信息平台能否解决高信任服务的匹配问题？ | https://www.gsb.stanford.edu/faculty-research/publications/case-studies |\n| C029 | Resonac: A Startup with 26,000 Employees，OB120 | B | 大组织文化转型如何落地？ | https://www.gsb.stanford.edu/faculty-research/publications/case-studies |\n| C030 | AMAG汽车行业转型，IMD案例入口 | B | 经销服务企业如何应对行业变化？ | https://imd.org/research-knowledge/case-studies |\n\n目录中的动态页面可能更新；保留题名/编号便于再次定位。B条目只代表已发现可用线索，不代表免费全文或教师答案可取得。\n\n## 9. 七张入门训练卡\n\n以下仅给事实边界、问题与证据缺口，不预置标准答案。难度1=入门诊断，2=多因素取舍，3=综合投资。每次出题再从来源补足必要材料。\n\n### C001 服务扩张：Managed by Q（难度2）\n\n事实：2015年7月，公司已有纽约、芝加哥、旧金山业务，创始人在现有市场获客、新市场扩张与增加服务间选择。公司同时重视员工投入和技术。案例正文第1—4页提供决策与服务背景。\n\n正文：https://mitsloan.mit.edu/sites/default/files/2024-04/Managed%20by%20Q.pdf\n\n题卡：①只选一个优先增长方向，理由是什么？②你最需要哪两项单位经济性证据？③怎样设置一个不损害现有履约的小试验？\n\n边界：未给可靠CAC、客户留存或跨城固定成本，不能虚构回收期。迁移：取送车业务的城市密度与品类扩张。后续结果暂不揭晓。\n\n### C002 客服整合：Quest Diagnostics（难度2）\n\n事实：2015年新负责人接手客服业务；此前20个中心合并为两个，存在成本、缺勤、流失与服务问题。来源为官方案例摘要与正文入口。\n\n正文：https://mitsloan.mit.edu/sites/default/files/2024-04/Quest%20Diagnostics%20A.pdf\n\n题卡：①先抓哪个问题，为什么？②什么证据能区分人手不足、流程问题和技能问题？③用什么短周期指标判断行动有无副作用？\n\n边界：中心数量下降本身不能证明效率改善，也不能证明造成所有问题。需补分时来电、处理时长、一次解决率和人员数据。迁移：调度与城市运营支持。\n\n### C003 平台收费：interviewing.io（难度2）\n\n事实：平台让工程师匿名练习面试，由企业为接触合格人才付费；2020年招聘冻结冲击收入。官方页面讨论多边平台与新收入选择。\n\n正文：https://mitsloan.mit.edu/sites/default/files/2025-11/iio.final_.11.03.23_0.pdf\n\n题卡：①你会优先尝试哪种收费对象/产品？②这一选择会怎样影响另一端？③要验证哪条付费意愿假设？\n\n边界：需补展表、实际用户分层和合同条款；不把用户数量当作网络效应已经成立。迁移：司机、渠道、平台之间的补贴与收费。\n\n### C004 会员模式：Costco（难度1）\n\n事实：2024财年披露净销售额249,625百万美元、会员费4,828百万美元；比较年度分别为52周和53周，周期不完全相同。\n\n题卡：①会员费为什么可能影响零售定价？②还需要什么资料才能判断会员模式是否值得复制？③选一个适合/不适合会员制的本地服务并说明理由。\n\n边界：会员费收入不能直接等同会员业务净利润；两期增速需注意周数；不得依据会员费与公司利润的简单对比就宣称“全部利润来自会员”。需要续费、服务成本和客户行为证据。迁移：服务包月与订阅。\n\n### C005 盈利质量：Uber（难度2）\n\n事实：2023年营业利润1,110百万美元，归属公司净利润1,887百万美元；披露全年股权投资重估带来税前净收益约1,600百万美元。数据出自2024年发布的全年业绩。\n\n题卡：①怎样描述盈利改善而不夸大？②你会优先核实哪两项现金流/运营证据？③若要评估新城市投入，还缺什么？\n\n边界：税前重估收益不能直接从税后净利润相减得到精确经营净利润。现金流、调整后EBITDA与营业利润分别核对。迁移：平台业务的经营改善与财务口径。\n\n### C006 增长与盈利：瑞幸（难度1—2；MBA-001）\n\n决策信息截止：2024-02-23。身份：在该日参与经营讨论的分析负责人。下表为公司披露的季度事实，不是模拟数据；单位人民币百万元。\n\n| 指标 | 2022Q4 | 2023Q4 |\n|---|---:|---:|\n| 总净收入 | 3,695.0 | 7,065.0 |\n| 自营店收入 | 2,697.1 | 5,103.4 |\n| 自营店店面经营利润 | 581.5 | 690.4 |\n| 自营店店面经营利润率 | 21.6% | 13.5% |\n\n2023Q4自营同店销售增长13.5%。注意：同店指标、自营收入与集团总收入不是同一口径；店面利润不等于集团净利润。\n\n教学决策情景（原创假设，不声称公司当时提出过该动议）：有人建议下一季度继续大幅增加开店与获客预算，认为增长已经证明模式成功。\n\n三个问题：\n1. 给出最重要的两条经营判断，并用计算支持；分别标注事实和推断。\n2. 对增加预算，你选择全面推进、分范围推进、有限验证还是暂缓？给出依据，不能只以“数据不够”结束。\n3. 只能追加一项分析，你选什么？什么结果会改变你的决定？\n\n边界：表中不能确定降价、门店成熟度、竞争或成本各贡献多少；不能用收入增长直接推断投资回报。评分重点为口径、证据、取舍与调查区分力，回答前不提示算法。\n\n### C007 长期主义：Amazon 1997（难度2）\n\n事实：1997股东信报告销售额147.8百万美元、增长838%，并把客户重复购买、品牌与长期市场地位放在重要位置。材料是管理层对策略的说明，不是独立因果证据。\n\n题卡：①在不知道后续成功的前提下，哪些信息支持继续投入？②哪些未知会使你反对？③为一个早期项目设计资本上限与里程碑。\n\n边界：不能因为后来成功就推断当年每项投入合理。需要成本、现金消耗、竞争和留存证据。迁移：AI产品和第二曲线的小额长期试验。\n\n## 10. 首月编排（候选顺序，不提前泄题）\n\n| 周 | 主案例 | 训练目标 | 迁移 |\n|---|---|---|---|\n| 1 | C006瑞幸、C004 Costco | 规模与盈利、商业模式 | 代驾包月、渠道优惠 |\n| 2 | C001 Q、C002 Quest | 服务密度、履约、组织约束 | 取送车城市/门店布局 |\n| 3 | C003 interviewing.io、C005 Uber | 双边平台、收费、利润质量 | 三方渠道与司机供给 |\n| 4 | C007 Amazon、补证后的C023途虎 | 长期投入、可复制性、资本约束 | 第二曲线与车后项目 |\n\n每周两个主案例可拆为多轮，不等于每天重复同一算法。若某题已能无提示完成，减少同型练习，转为异行业应用。\n\n## 11. 后续扩库程序\n\n每次培训运行可增加一个经核验的新条目，先补中国、汽车后市场、服务小企业、失败项目。每周末检查本周新增和重复，不以数量代替证据质量。目标是逐步形成100个可检索条目，其中至少30个可直接训练的题卡；这是扩展目标，不是现有完成量。\n\n优先渠道：\n- MIT案例分类入口：https://mitsloan.mit.edu/teaching-resources-library/mit-sloan-case-studies\n- Stanford案例目录：https://www.gsb.stanford.edu/faculty-research/publications/case-studies\n- Yale案例访问规则：https://cases.som.yale.edu/index.php/accessing-and-using-cases （免费、注册免费、付费分别标注）\n- IMD案例目录：https://www.imd.org/research-knowledge/case-studies/collection/\n- 中欧案例获取说明：https://ceibs.libguides.com/casestudies/faculty （部分权限针对教师，不冒用身份）\n- 企业投资者关系披露与港交所年报，尤其途虎、美团、瑞幸及汽车服务相关企业。\n\n出题前复核来源；遇到访问失败，换公开第一手材料，不能凭标题补写事实。新案例需去重、标注日期和证据等级。引用学校案例不暗示已获学校认证。\n\n## 12. 学习记录与迁移协议\n\n本期首题：MBA-001 / C006；状态：已设计，待作答。当前没有任何MBA新课完成记录。\n\n每次学习记录字段：lesson_id、case_id、作答日期、题目、原答、是否提示、评分维度与依据、事实/计算错误、教练示范、唯一改进动作、复测日期、复测结果。\n\n跨AI使用时，以本文件、原始答卷、版本化学习记录为准，不依赖某一平台隐含记忆。不能把未看到的答卷当作不存在；不能把已展示答案后的改正标为无提示独立答对。无法读取旧记录时明确证据范围。\n\n每日任务应先读取此库与可见答卷，再出题。若当次环境支持写回，更新同一知识库的条目/学习状态并保留历史；若不支持，输出带ID的追加记录，明确未写回，不宣称自动沉淀成功。\n\n版本记录：V1，2026-11-06；11所机构课程/教学来源、30个案例条目、7张入门卡、24周课程和首月安排。\n";let db,view='home',selected='MBA-001',filter='';const KEY='zhipeng-personal-mba-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(d){if(!d||d.schemaVersion!==1||!Array.isArray(d.cases)||!Array.isArray(d.lessons)||!d.records||typeof d.records!=='object'||Array.isArray(d.records))throw Error('备份格式不兼容');if(d.cases.length>5000||d.lessons.length>5000)throw Error('数据量过大');let ids=new Set;for(let l of d.lessons){if(typeof l.id!=='string'||ids.has(l.id)||!Array.isArray(l.questions)||!d.cases.some(c=>c.id===l.caseId))throw Error('课程编号重复或案例缺失');ids.add(l.id)}return d}

if(view==='home'){let next=db.lessons.find(l=>!db.records[l.id]?.submittedAt)||db.lessons[0];h=`<h1>把商业直觉，练成决策能力。</h1><p class="muted">保护家庭与现金流，积累可迁移能力，逐步验证第二曲线。</p><section class="hero"><div class="eyebrow">YOUR NEXT DECISION · 15—20 MIN</div><h2>${esc(next.title)}</h2><p>回到当年的决策现场，先独立作答，再让 AI 挑战你的判断。</p><button class="primary" onclick="openLesson('${esc(next.id)}')">进入训练 →</button></section><div class="grid"><div class="card"><div class="stat">${db.cases.length}</div>案例条目<p class="muted">${db.cases.filter(c=>c.level==='A').length} 个已整理入门材料</p></div><div class="card"><div class="stat">${done} / ${db.lessons.length}</div>已提交训练<p class="muted">提交与批改分别记录</p></div><div class="card"><div class="stat">24 周</div>课程框架<p class="muted">根据实际表现调整节奏</p></div></div><div class="notice">答卷保存在当前浏览器。跨电脑、移动文件或清理浏览器前，请导出备份。首次使用建议进入「备份与资料」。</div>`}
if(view==='class'){let l=current(),c=db.cases.find(c=>c.id===l.caseId),r=db.records[l.id]||{};h=`<h1>训练课堂</h1><select onchange="selected=this.value;render()">${db.lessons.map(x=>`<option value="${esc(x.id)}" ${l.id===x.id?'selected':''}>${esc(x.id+' · '+x.title)}</option>`).join('')}</select><section class="hero"><span class="badge">${esc(l.id)} · 独立作答</span><h2>${esc(l.title)}</h2><p>本课目标：提高证据判断与资源配置能力，让未来的经营投入和第二曲线试验更可靠。</p></section><div class="card"><h3>案例材料</h3><div>${material(studentMaterial(c.body))}</div><a href="${safeURL(c.url)}" target="_blank" rel="noopener">查看原始来源 ↗</a></div><form onsubmit="submitAnswer(event)">${l.questions.map((q,i)=>`<h3>${i+1}. ${esc(q)}</h3><textarea aria-label="第${i+1}题答案" id="a${i}" oninput="draft()" placeholder="写下判断、依据与计算……">${esc(r.answers?.[i]||'')}</textarea>`).join('')}<div class="row"><button type="submit" class="primary">提交答卷</button><button type="button" onclick="draft();toast('草稿已保存')">保存草稿</button><button type="button" onclick="go('coach')">交给 AI 批改 ↗</button></div><p class="muted">${r.submittedAt?'已提交：'+esc(r.submittedAt):'尚未提交；输入时自动保存草稿。'}</p></form><details><summary>保存 AI 反馈与唯一改进动作</summary><textarea id="feedback" placeholder="粘贴教练反馈，不自动当作已掌握">${esc(r.feedback||'')}</textarea><input id="action" placeholder="本次唯一改进动作" value="${esc(r.action||'')}"><button onclick="saveFeedback()">保存反馈</button></details>`}
if(view==='cases'){let cs=db.cases.filter(c=>(c.title+c.topic+c.id).toLowerCase().includes(filter.toLowerCase()));h=`<h1>真实商业案例库</h1><p class="muted">A：已整理必要片段 · B：待补读正文 · C：待核验关键口径</p><input aria-label="搜索案例" placeholder="搜索公司、行业或决策问题" value="${esc(filter)}" oninput="filter=this.value;render();let e=document.querySelector('[aria-label=搜索案例]');e.focus();e.setSelectionRange(e.value.length,e.value.length)"><div class="list">${cs.map(c=>`<article class="card"><span class="badge">${esc(c.id)} · ${esc(c.level)}</span><h3>${esc(c.title)}</h3><p>${esc(c.topic)}</p><details><summary>阅读材料</summary><div>${material(studentMaterial(c.body))}</div></details><a href="${safeURL(c.url)}" target="_blank" rel="noopener">官方来源 ↗</a></article>`).join('')}</div>`}
if(view==='path'){h='<h1>24周 · 专属学习路径</h1><p class="muted">先完成已有案例，再按掌握情况扩充；24周代表课程框架，当前已内置7组训练。</p>'+['商业模式与客户需求','会计与利润质量','定价、营销与渠道','运营与供给','战略与竞争','公司金融与资本配置','投资与估值','组织、激励与谈判','平台、网络效应与AI','创业与低风险验证','宏观、治理与危机','综合资源配置'].map((x,i)=>`<div class="card" style="margin:12px 0"><span class="badge">第${i*2+1}—${i*2+2}周</span><h3>${x}</h3></div>`).join('')+'<details><summary>完整课程规则与来源</summary><pre>'+esc(CURRICULUM)+'</pre></details>'}
if(view==='history'){h='<h1>你的学习档案</h1><p class="muted">原始提交保留版本；草稿、提交和批改不会混为一谈。</p>'+db.lessons.filter(l=>db.records[l.id]).map(l=>{let r=db.records[l.id];return `<div class="card" style="margin:15px 0"><span class="badge">${r.submittedAt?'已提交':'草稿'} · ${r.feedback?'已有反馈':'待批改'}</span><h3>${esc(l.title)}</h3><p>${esc(r.action||'尚未记录改进动作')}</p><button onclick="openLesson('${esc(l.id)}')">查看答卷</button><details><summary>提交历史（${r.versions?.length||0}次）</summary><pre>${esc(JSON.stringify(r.versions||[],null,2))}</pre></details></div>`}).join('');if(!Object.keys(db.records).length)h+='<div class="hero">还没有学习记录。从第一课开始即可。</div>'}
if(view==='coach'){h=`<h1>更换教练，保留进度。</h1><p>选择课程，生成包含目标、规则、案例、原答与历史反馈的交接包，交给 Kimi、Workbuddy、DeepSeek 或其他 AI。</p><div class="card"><select onchange="selected=this.value;render()">${db.lessons.map(l=>`<option value="${esc(l.id)}" ${selected===l.id?'selected':''}>${esc(l.id+' '+l.title)}</option>`).join('')}</select><p class="muted">本版采用手动交接；未连接模型API，不会在后台自动批改。</p><textarea id="handoff" style="min-height:320px" readonly>${esc(handoff())}</textarea><div class="row"><button class="primary" onclick="copyHandoff()">复制教练交接包</button><button onclick="download('MBA-教练交接.md',handoff(),'text/markdown')">下载交接文件</button></div></div><p>获得批改后，在「训练课堂」保存反馈。想让执行端维护文件，可将整个文件夹交给 Workbuddy，并让它阅读 WORKBUDDY.md。</p>`}
if(view==='data'){h=`<h1>学习资产，由你持有。</h1><div class="grid"><div class="card"><h3>备份与恢复</h3><p>备份包含案例、课程、答卷、提交历史与反馈。恢复会覆盖当前数据，请先导出。</p><button class="primary" onclick="backup()">导出全部学习数据</button><p><label>选择备份文件<input type="file" accept=".json" onchange="importData(this.files[0])"></label></p></div><div class="card"><h3>独立资料</h3><p>开放 JSON 格式，保留 schemaVersion。可交给其他工具继续维护。</p><button onclick="download('knowledge.json',JSON.stringify({schemaVersion:1,cases:db.cases,lessons:db.lessons},null,2))">导出课程资料</button><button onclick="download('curriculum.md',CURRICULUM,'text/markdown')">导出课程说明</button></div><div class="card"><h3>使用边界</h3><p>可离线阅读、做题、保存。浏览器关闭后不会自动出题或搜索。长期调度需交给运行中的执行端。</p><p>不存储API密钥。联网批改由你选用的AI服务完成。</p></div></div><div class="notice">长期保存：下载完整包 → 解压到固定目录 → 打开 index.html → 定期导出学习备份并另存一份。迁移时，复制文件夹并导入最新备份。无痕模式不适合长期学习。</div>`}
document.getElementById('app').innerHTML=h}
function material(s){let lines=s.split('\n'),h='',rows=[];function flush(){if(rows.length){h+='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse">'+rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r)).map((r,i)=>'<tr>'+r.slice(1,-1).split('|').map(c=>'<'+(i?'td':'th')+' style="padding:10px;border-bottom:1px solid #dce2d9;text-align:left">'+esc(c.trim())+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';rows=[]}}for(let l of lines){if(l.startsWith('|'))rows.push(l);else{flush();h+='<p>'+esc(l)+'</p>'}}flush();return h}
function studentMaterial(s){return s.split('题卡：')[0].split('三个问题：')[0].split('边界：')[0].trim()}
function safeURL(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?esc(u):'#'}catch{return '#'}}
function draft(){let l=current(),r=db.records[l.id]||{};r.answers=l.questions.map((_,i)=>document.getElementById('a'+i).value);r.updatedAt=new Date().toISOString();db.records[l.id]=r;persist()}
function submitAnswer(e){e.preventDefault();draft();let r=db.records[current().id];if(r.answers.some(a=>!a.trim()))return toast('请先完成全部问题，再提交');r.submittedAt=new Date().toISOString();r.versions=r.versions||[];r.versions.push({at:r.submittedAt,answers:[...r.answers]});if(persist()){render();toast('答卷已提交；可生成教练交接包')}}
function saveFeedback(){let r=db.records[current().id]||{answers:[]};r.feedback=document.getElementById('feedback').value;r.action=document.getElementById('action').value;db.records[current().id]=r;if(persist())toast('反馈已保存')}
function handoff(){let l=current(),c=db.cases.find(c=>c.id===l.caseId),r=db.records[l.id]||{};return `# 专属MBA教练交接\n你是我的商业教练。目标：保护家庭与现金流、建立可迁移能力、低风险试验第二曲线。请询问学习者需要迁移的业务场景。\n请根据事实、量化口径、证据与因果、资源取舍和验证设计严格评估。不因暂缓加分，不用后见之明。不把实际结局当作唯一答案。完整作答前不得泄题；未提交视为草稿。批改后给原创示范，最后只留一个改进动作。不得冒充学校教学指南。新增假设明确标注。\n请根据本次实际答卷建立能力基线。\n课程：${l.id} ${l.title}\n来源：${c.url}\n材料：\n${c.body}\n问题：\n${l.questions.map((q,i)=>`${i+1}. ${q}`).join('\n')}\n作答状态：${r.submittedAt?'已完整提交':'未提交/草稿，不评分'}\n我的答卷：\n${(r.answers||[]).map((a,i)=>`${i+1}. ${a}`).join('\n')||'尚未作答'}\n既往学习记录：\n${JSON.stringify(db.records,null,2)}\n请只根据可见证据评价，不假设未见的训练已完成。反馈需注明课程ID，供我保存。`}
async function copyHandoff(){try{await navigator.clipboard.writeText(handoff());toast('已复制，可粘贴给其他AI')}catch{let e=document.getElementById('handoff');e.select();toast('请按 Ctrl+C 复制，或下载交接文件')}}
async function importData(file){if(!file)return;try{if(file.size>10000000)throw Error('文件超过10MB');let data=validate(JSON.parse(await file.text()));if(!confirm('将覆盖当前学习记录。已导出当前备份？确定继续？'))return;db=data;if(persist()){render();toast('恢复成功')}}catch(e){toast('未导入：'+e.message)}}
render();
</script></html>

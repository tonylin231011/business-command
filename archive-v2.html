const E={"id": "STR-0001", "version": 2, "title": "千团大战 · 活到下一轮", "subtitle": "2011 / 中国本地生活 / 三幕历史决策沙盘", "role": "你受命进入美团的经营决策席。你承担类似王兴的资源取舍职责；以下决策菜单为编辑设计，不是当年会议实录。", "sources": [{"id": "S1", "date": "2011-03-14", "title": "北京商报：过期包退计划（同期报道）", "url": "https://finance.ifeng.com/news/special/2011315/20110314/3655793.shtml"}, {"id": "S2", "date": "2011-07-07", "title": "新浪科技：B轮融资发布会（同期采访）", "url": "https://tech.sina.com.cn/i/2011-07-07/11005745178.shtml"}, {"id": "S3", "date": "2011-07-07", "title": "经济观察网：融资与广告策略（同期采访）", "url": "https://www.eeo.com.cn/2011/0707/205540.shtml"}, {"id": "S4", "date": "2011-11-11", "title": "新浪科技：IPO延迟（消息来源含匿名人士，原因未获独立证实）", "url": "https://tech.sina.com.cn/i/2011-11-11/09216306701.shtml"}, {"id": "S5", "date": "2012-06-21", "title": "北京青年报：拉手6月19日撤销申请", "url": "https://msn.finance.sina.com.cn/gdxw/20120621/0000998863.html"}, {"id": "S6", "date": "2014-02-21", "title": "王兴十年（回顾性人物报道，清华校友总会转载）", "url": "https://www.tsinghua.org.cn/info/1014/11230.htm"}], "scenes": [{"date": "2011-03-14", "title": "第一幕：信任的代价", "dispatch": "一份退款公告放在桌上。行业习惯将未消费的过期券留在平台。你的团队已经宣布返还这部分余额。增长团队仍在争取投入，财务需要知道你接下来优先守住什么。", "facts": ["美团已宣布过期包退，涉及此前未消费款项1000余万元人民币。[S1]", "本幕不提供真实现金余额、净烧钱速度或现金跑道；公开材料不足。"], "sourceIds": ["S1"], "question": "既定退款承诺已经存在，下一阶段你把哪个目标放在首位？", "options": [{"id": "growth", "name": "扩大触达", "text": "优先新增用户与城市触达；接受短期获客支出压力。", "tradeoff": "需要证明新增客户能留下来，并核对现金支出。"}, {"id": "trust", "name": "兑现服务", "text": "优先退款兑现、客户解释与商户交付；限制同期新增项目。", "tradeoff": "服务改善未必立刻带来规模，机会窗口也会收窄。"}, {"id": "reserve", "name": "保留选择", "text": "优先现金盘点、收支预测与储备；分阶段批准新增投入。", "tradeoff": "等待信息也有成本，谨慎可能错过优质商户。"}], "budgetLabel": "用100枚教学资源筹码表达本幕投入强度（不是公司真实现金）", "prediction": "在2011年7月底之前，美团是否会宣布完成新一轮融资？", "outcome": true, "resolution": "2011年7月7日，发布会宣布B轮5000万美元到账。[S2]", "history": "过期退款是本幕开始前已经公布的承诺，不是你选择后才发生。资料不足以还原当时所有预算讨论。", "backdrop": ["先理解生意：消费者先在线付款，再拿团购券去线下商户消费。平台把用户和商户连起来，收到钱与完成服务之间有时间差。", "你面对的不只是获客竞争。用户担心券买了不能用，商户担心客人来了、款却结不到。看起来同样是账上的钱，有的是资本，有的背后还挂着履约义务。", "本幕用“退款公告已经发出”作为起点。你不能撤回既定承诺来获得一个轻松答案。现在要决定的是：如何让承诺在资源分配里真正有位置。"], "reveal": {"actual": "美团已推出过期退款，并非只用低价吸引用户。[S1] 你的任务是在这个已发生的选择之上安排后续优先级，而不是重新决定退款政策。", "why": "经营分析：它放弃了一部分沉淀款带来的短期便利，换取对承诺可兑现的信任。关键区别是，把用户愿意第一次付款，和用户愿意长期相信平台，视作两个问题。该机制合理，但本幕没有实验数据证明退款单独带来了多少增长。", "insight": "原来，现金纪律不等于所有现金都攥住。属于用户承诺的款项被留住，账面可能更好看，经营信用却可能受损。", "feedback": {"growth": "你优先解决“更多人来”，但此刻要防的缺口是“来了以后是否兑现”。若新增用户走进同样的退款与交付问题，增长会放大问题。检查你的触发器是否包含履约或复购，而不只是拉新量。", "trust": "你把承诺兑现放到了前面，识别了信任约束。但“重视服务”仍不等于划算：你需要跟踪退款兑现、复购与交付成本，不能把任何服务支出都自动解释为长期投入。", "reserve": "你保留了机动空间，但需要区分自由资金与承诺款。若储备依赖延后兑现已承诺退款，它保住的可能只是账面；若先足额保障义务再限新增项目，则更能自洽。"}, "compare": ["扩大触达：在履约可靠时可能有效；这里需证明不会把未解决的服务问题规模化。", "兑现服务：与已公布方向一致，但必须检查效果，不能据历史方向认定所有投入都合理。", "保留选择：防止失血有价值；要先划清退款与结算义务，不能冻结所有经营动作。"], "bridge": "先把本幕的判断消化，再把日历翻到7月。下一幕新增融资消息；它是历史进程，不是系统奖励你的选择。", "ids": ["S1"]}}, {"date": "2011-07-07", "title": "第二幕：钱到了，仗怎么打", "dispatch": "新一轮融资已宣布完成。各条战线都在申请资源。这一刻，融资额是已知，下一轮融资是否容易仍是未知。请给出你愿意承担的投入节奏。", "facts": ["B轮融资5000万美元已到账；同期报道转述首轮资金尚未使用。[S2]", "截至5月底，开站接近100城，员工1800多人，均为当时公司披露口径。[S2]", "融资金额不是可自由支配现金余额，缺少商户结算、退款义务和净流出数据。"], "sourceIds": ["S2"], "question": "面对扩张需求，你选择哪条主路线？", "options": [{"id": "ads", "name": "集中买曝光", "text": "把新增投入集中于品牌与广告触达，争取先形成用户规模。", "tradeoff": "需要持续监测获客成本和复购，防止流量未转成经营贡献。"}, {"id": "service", "name": "经营能力优先", "text": "把新增投入放在服务、技术和人才，按城市表现逐步追加。", "tradeoff": "建设周期较长，对手可能先抢走显眼位置。"}, {"id": "cash", "name": "延长储备", "text": "降低新增承诺，先守结算和退款能力，再等待行业变化。", "tradeoff": "现金更充裕，但竞争位置也可能下降。"}], "budgetLabel": "本幕教学投入强度：0—100枚筹码（各幕独立，不模拟历史财务）", "prediction": "未来12个月内，拉手网会完成赴美IPO挂牌吗？", "outcome": false, "resolution": "2012年6月报道：拉手已于6月19日撤销上市申请。[S5]", "history": "同期采访报道美团不准备加入广告烧钱战；发布会列出的资金用途包括服务、技术、人才。[S2/S3] 这是主张与方向证据，不足以证明这些选择单独导致胜出。", "backdrop": ["融资新闻让团队暂时松了一口气，但增长申请并不会自动分出先后。新增城市、购买曝光、做产品与培训销售，都会争夺这笔钱。", "同样增加一笔销售额，可能来自一次性的折扣，也可能来自复购；同样一枚筹码，可能买来短暂流量，也可能形成组织能力。没有成本和留存数据，就不能只看表面热闹。", "你的任务不是预测美团最终会不会赢，而是在未知未来中给出投入节奏。你有资金，但不知道未来融资窗口能开多久。"], "reveal": {"actual": "美团当时公开表达不加入广告烧钱战，同时把服务、技术与人才列入资金用途。[S2/S3] 这是投入方式的取舍，不是停止获客。", "why": "经营分析：品牌曝光是否带来可留存、可盈利的需求，需要额外证据；资金既可用于追逐当期规模，也可保留以后行动的余地。真正该比较的是不同渠道的增量获客成本、复购和现金回收，而非“打广告/不打广告”的道德高下。", "insight": "原来，拿到钱之后最难的并不是敢不敢花，而是能否拒绝用对手的支出节奏替自己做预算。", "feedback": {"ads": "你的方案押注曝光能沉淀为客户资产。若只有新增用户、没有留存和贡献的验证，逻辑中缺了一环：买来注意力之后，谁为持续服务买单？这是一项待验证假设，不能仅凭后来历史给你判错。", "service": "你选择了与公开方向接近的投入，但仍需防止“能力建设”成为无法验证的口袋。应给出投入里程碑、期限与经营指标，而不是因为选中了历史方向就通过。", "cash": "你识别了融资不确定性。但把现金都保留下来，也可能错过经营建设。应说清保留资金覆盖什么义务、哪类项目仍可小额推进；防守不必等于全面停摆。"}, "compare": ["集中买曝光：可能占据心智，代价是回收不确定；需要渠道与复购验证。", "经营能力优先：可能改善长期效率，代价是见效慢；需要里程碑与停止线。", "延长储备：降低断粮风险，代价是错失部分增长；需要明确最低储备与可批准的投入。"], "bridge": "广告选择的机制已经摊开。现在进入11月：新情报只揭示IPO推迟，不提前告诉你最终结局。上一项事件预测仍留到终局结算。", "ids": ["S2", "S3"]}}, {"date": "2011-11-11", "title": "第三幕：寒意先到", "dispatch": "关于拉手IPO推迟的消息传到经营席。注意，它还没有被正式撤回。你的决定必须适用于“对手很快重启”与“窗口长期关闭”两种情景。", "facts": ["当日媒体报道拉手暂停路演并推迟IPO，仍有重启可能。[S4]", "报道含匿名消息，关于会计问题及举报原因的说法不能视为已定论。[S4]", "没有可靠证据证明某个核心城市出现补贴翻倍或商户独家买断，本局不加入这些桥段。"], "sourceIds": ["S4"], "question": "你如何把融资风险转化为下一阶段的行动？", "options": [{"id": "expand", "name": "加速抢位", "text": "趁对手不确定，争取商户与人才；设定投入上限和停止条件。", "tradeoff": "机会可能短暂，也可能把自己拖入不可逆支出。"}, {"id": "hold", "name": "守住经营", "text": "优先结算、退款与履约，放慢新增城市，保留机动资金。", "tradeoff": "更能承受坏情景，也可能让出份额。"}, {"id": "org", "name": "补齐组织", "text": "把优先级交给区域管理、销售质量与流程，扩张按能力放行。", "tradeoff": "组织投入见效慢，需要承担管理变革成本。"}], "budgetLabel": "本幕教学投入强度：0—100枚筹码", "prediction": null, "history": "回顾性报道记载：干嘉伟于2011年11月16日加入，随后调整区域管理体系。[S6] 这是事后资料，不能提前作为本幕情报。公开材料不足以确认当时是否正式比较过菜单中的所有方案。", "backdrop": ["对手的IPO出了变数。它可以被理解为抢位窗口，也可以是整个行业融资环境变差的警报。这两种解释会导向不同的行动。", "保留现金只是争取了时间。如果组织无法把资金转成稳定的商户供给和交付，等来的机会也未必接得住；反过来，没有现金约束的扩张也可能加速失血。", "这一幕要求你把战略落实到组织和节奏。不要提前把“上市推迟”当作竞争对手已经出局。"], "reveal": {"actual": "事后人物报道记载，干嘉伟于11月16日加入，并将区域管理从两个大区调整为八个。[S6，回顾性来源] 这是组织建设的实际动作，不能据此断言当时所有其他投入都停止了。", "why": "经营分析：扩大覆盖会增加信息传递、培训和质量控制的负担。增加管理层级的目的应是让区域经营有人负责、异常能被发现和纠正，而不是为层级本身付费。组织建设与机会性扩张可以互补，关键在承载能力和投入边界。", "insight": "原来，活过寒冬只是资格；能否接住机会，还取决于组织是否能把分散城市变成可管理的经营网络。", "feedback": {"expand": "你看到了窗口，但要检查能否承载。现金尚在、对手遇阻，都不等于新增城市会成功；若没有区域负责人、供给质量与单位经济性的门槛，窗口可能变成失控扩张的借口。", "hold": "你防范了外部风险，却要检查是否把融资不确定性等同于所有建设都应该推迟。即使放慢城市扩张，也可以改善现有区域管理，否则只是延长同一套低效系统的寿命。", "org": "你找到了组织约束，与报道中的动作接近。但不能把增加大区数量当作成功原因本身。需要明确谁负责、信息怎样上行、经营异常怎样处理，再验证这些改变是否改善交付。"}, "compare": ["加速抢位：抓机会有道理，须有承载能力门槛，不能把对手困难当作自己的能力。", "守住经营：防止失血有道理，但不应自动排除提升效率的建设。", "补齐组织：有实际动作证据支持；效果仍需数据验证，不能把历史重合当作因果证明。"], "bridge": "三次命令已经封存。下一步结算事件预测，并把你每幕选择中的关键假设汇总成一份可以带走的复盘。", "ids": ["S6"]}}], "debrief": "本局不是平行宇宙收益预测。你的选择会留下不同的资源与风险承诺，下一幕仍按真实历史时间推进。未建模的利润与市占率不会凭选择生成。训练目标：把现金义务、投入强度、证据限制和行动触发器连成决策。", "transfer": "映射到区域运营：司机供给、商户交付、补贴拉量与城市扩张争夺同一份资源。写出一个你现在业务里可以用明确停止线约束的小额试验。"};const KEY='business-command-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{runs:[],active:null}}catch{state={runs:[],active:null}}let choice=null,entered=Date.now();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('保存失败，请立即导出战绩')}}
function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:2,episode:E.id,...state},null,2)],{type:'application/json'}));a.download='商业沙盘战绩.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function restore(file){if(!file)return;file.text().then(t=>{let d=JSON.parse(t);if(d.schemaVersion!==2||!Array.isArray(d.runs)||d.episode!==E.id)throw Error('格式不匹配');if(d.active&&(!Array.isArray(d.active.decisions)||d.active.decisions.length>3))throw Error('进度无效');if(confirm('恢复将覆盖本机沙盘战绩，请先导出。继续？')){state={runs:d.runs,active:d.active};save();render()}}).catch(e=>alert('恢复失败：'+e.message))}
function begin(){state.active={id:Date.now().toString(),episode:E.id,version:E.version,startedAt:new Date().toISOString(),decisions:[]};choice=null;entered=Date.now();save();render()}
function home(){document.getElementById('app').innerHTML=`<div class="kicker">沉浸式商业案例 · 首集体验版</div><h1>经营者，<br>这一次由你拍板。</h1><p class="muted">封存未来的信息，进入真实的商业关口。选择路线、承诺资源、押上判断，然后对照历史。</p><div class="panel"><span class="tag">STR-0001 · 战略 / 运营 / 资本</span><h2>千团大战 · 活到下一轮</h2><p>2011年，团购行业拥挤而躁动。你坐进美团经营决策席。新钱、退款承诺与销售组织，将三次考验你的选择。</p><div class="row"><button class="primary" onclick="begin()">接受任命 →</button>${state.active?'<button onclick="render()">继续本局</button>':''}</div><p class="muted">约15—20分钟 / 三幕逐幕讲评 / 两项可结算预测 / 无倒计时强迫</p></div><div class="grid"><div class="panel"><span class="tag">01 / 已可体验</span><h3>千团大战</h3><p>资金、信任与组织如何排兵布阵。</p></div><div class="panel"><span class="tag">02 / 待核验</span><h3>Managed by Q</h3><p>扩城市、加品类还是做密度？待补完整历史结果后开放。</p></div><div class="panel"><span class="tag">03 / 待核验</span><h3>平台收入的第二条路</h3><p>招聘冻结时，向哪端收费？不以虚构结局凑集数。</p></div></div><details><summary>恢复沙盘备份</summary><input aria-label="恢复沙盘备份" type="file" accept=".json" onchange="restore(this.files[0])"></details><footer>这是一集体验版，尚未按“三集齐备”标准开启日更。网页只将未来信息从正常流程隐藏，静态源码无法防止主动查看剧透。记录保存在当前浏览器，须导出备份。</footer>`}
function render(){let r=state.active;if(!r)return home();if(r.pendingReview!==undefined&&r.pendingReview!==null)return revealScene(r.pendingReview);let i=r.decisions.length;if(i===E.scenes.length)return report();let s=E.scenes[i];choice=null;entered=Date.now();document.getElementById('app').innerHTML=`<div class="row"><button onclick="home()">← 指挥席</button><span class="kicker">${E.id} / ${s.date} / 情报截止此刻</span></div><h1>${s.title}</h1><div class="timeline">${E.scenes.map((_,n)=>`<span class="${n<=i?'done':''}"></span>`).join('')}</div><p class="muted">${i===0?E.role:'真实进程继续推进。你的上一幕选择已封存；本幕不会假装是它造成了历史事件。'}</p><div class="panel"><div class="tag">情报室 / 本幕新增</div><p>${s.dispatch}</p>${s.facts.map(f=>`<div class="fact">${esc(f)}</div>`).join('')}<details><summary>本幕来源与证据</summary>${E.sources.filter(x=>s.sourceIds.includes(x.id)).map(x=>`<p>[${x.id}] ${x.date} <a target="_blank" rel="noopener" href="${x.url}">${x.title}</a></p>`).join('')}</details></div><div class="panel"><div class="tag">进入现场 / 经营情境解释</div>${s.backdrop.map(t=>`<p>${t}</p>`).join('')}</div><h2>${s.question}</h2><p class="muted">选项是基于真实经营矛盾设计的教学备选，不声称是当年内部会议提案。</p><div class="grid">${s.options.map((o,n)=>`<button class="option" id="option${n}" onclick="pick(${n})"><strong>${o.name}</strong>${o.text}<small>承担的代价：${o.tradeoff}</small></button>`).join('')}</div><form onsubmit="commit(event)"><div class="panel"><label>${s.budgetLabel}<br><input id="budget" aria-label="教学投入强度" type="number" min="0" max="100" step="1" required placeholder="0—100"></label><label>你的停止条件 / 什么证据会让你改变主意？<textarea id="reason" required minlength="8" placeholder="写一条具体的行动触发器……"></textarea></label>${s.prediction?`<div class="tag">单独押注 / 历史可结算事件</div><p>${s.prediction}</p><label>你认为“会发生”的概率（不是对路线的信心） <input id="prob" type="number" min="0" max="100" required placeholder="0—100"> %</label>`:'<p class="muted">本幕路线没有可验证的二元成败标签，不计算置信度得分。</p>'}</div><button id="commit" class="primary" type="submit" disabled>封存决策，揭晓本幕 →</button></form><footer>筹码是教学表达，不是历史金额；选择不触发伪造的市场份额或利润。自由文本保留给教练评价。</footer>`}
function pick(n){choice=n;document.querySelectorAll('.option').forEach((e,k)=>e.classList.toggle('selected',k===n));document.getElementById('commit').disabled=false}
function commit(ev){ev.preventDefault();if(choice===null)return;let r=state.active,s=E.scenes[r.decisions.length],b=Number(document.getElementById('budget').value),reason=document.getElementById('reason').value.trim(),prob=s.prediction?Number(document.getElementById('prob').value):null;if(!Number.isInteger(b)||b<0||b>100||reason.length<8||prob!==null&&(!Number.isFinite(prob)||prob<0||prob>100))return alert('请核对投入、条件与概率');r.decisions.push({scene:r.decisions.length,option:s.options[choice].id,budget:b,reason,probability:prob,elapsedMs:Date.now()-entered,at:new Date().toISOString()});r.pendingReview=r.decisions.length-1;save();render();window.scrollTo(0,0)}

function diagnosis(i,d){let rev=E.scenes[i].reveal;return rev.feedback[d.option]||'旧版本选项：请参考本幕历史与路线比较。'}
function revealScene(i){let s=E.scenes[i],d=state.active.decisions[i],rv=s.reveal,o=s.options.find(o=>o.id===d.option);document.getElementById('app').innerHTML=`<div class="kicker">本幕揭晓 / ${s.date} / 暂停推进</div><h1>先别翻页。<br>看清这一步的取舍。</h1><div class="panel"><span class="tag">你的决策已封存</span><h2>${esc(o?.name||d.option)}</h2><p>教学投入 ${d.budget}/100</p><p>你的改变条件：${esc(d.reason)}</p></div><div class="panel"><span class="tag">01 / 当事人实际做了什么</span><h2>${s.title}</h2><p>${rv.actual}</p></div><div class="panel"><span class="tag">02 / 为什么这样做</span><p>${rv.why}</p><div class="fact"><strong>${rv.insight}</strong></div></div><div class="panel"><span class="tag">03 / 对照你选的路线</span><p>${esc(diagnosis(i,d))}</p><p class="muted">这是基于选项的风险诊断，不是对你内心动机的认定。自由文本完整批改仍需教练。</p>${d.budget>=80?'<p>你还选择了高投入强度：请检查上面的停止条件能否在大部分资源花完前触发。</p>':d.budget<=20?'<p>你选择了低投入强度：请检查计划在这个强度下是否仍能完成承诺，而不是只表达谨慎。</p>':''}</div><div class="panel"><span class="tag">04 / 逐条比较其余路线</span>${rv.compare.map(t=>`<p>${t}</p>`).join('')}<p class="muted">以上为经营分析；不是当事人逐条否决提案的会议纪要。</p></div><details><summary>本幕证据</summary>${E.sources.filter(x=>rv.ids.includes(x.id)).map(x=>`<p>[${x.id}] <a href="${x.url}" target="_blank" rel="noopener">${x.title}</a></p>`).join('')}</details><div class="panel"><h3>这一幕，你会修正哪一个假设？</h3><textarea id="reflection" placeholder="可写：我原本假设……，现在需要先验证……">${esc(d.reflection||'')}</textarea><p>${rv.bridge}</p><button class="primary" onclick="continueScene()">${i===2?'完成复盘，打开总战报':'我已理解，继续真实进程'} →</button><p class="muted">阅读节奏由你掌握，可留空继续。不会用强制等待增加时长。</p></div>`}
function continueScene(){let r=state.active;if(r.pendingReview===undefined||r.pendingReview===null)return;let d=r.decisions[r.pendingReview];d.reflection=document.getElementById('reflection').value.trim();d.reviewedAt=new Date().toISOString();delete r.pendingReview;save();render();window.scrollTo(0,0)}

function report(){let r=state.active;let scored=r.decisions.filter(d=>d.probability!==null),loss=scored.reduce((v,d)=>v+(d.probability/100-Number(E.scenes[d.scene].outcome))**2,0)/scored.length;let pct=Math.round((1-loss)*100);document.getElementById('app').innerHTML=`<div class="kicker">AFTER ACTION REVIEW / ${E.id}</div><h1>战役结束。<br>现在，打开历史档案。</h1><div class="grid"><div class="panel"><div class="tag">预测表现</div><h2>${pct} / 100</h2><p>100 × (1 − 平均Brier损失)</p></div><div class="panel"><div class="tag">样本边界</div><h2>${scored.length} 个事件</h2><p>单局预测表现，不代表已测得稳定校准度。</p></div><div class="panel"><div class="tag">决策质量</div><h2>逐幕诊断已生成</h2><p>已按所选路线指出假设缺口；自由文本仍待教练复核。</p></div></div>${r.decisions.map((d,i)=>{let s=E.scenes[i],o=s.options.find(o=>o.id===d.option);return `<div class="panel"><span class="tag">${s.date}</span><h2>${s.title}</h2><p>你的命令：${o.name} · 教学投入 ${d.budget}/100</p><p>触发器：${esc(d.reason)}</p><p class="muted">本幕停留约${Math.round(d.elapsedMs/1000)}秒（含阅读/离开页面时间，不用于能力评分）。</p>${s.prediction?`<p>你给“发生”${d.probability}%概率；实际：${s.outcome?'发生':'未发生'}。</p><p>${s.resolution}</p>`:''}<h3>历史对照</h3><p>${s.history}</p><h3>这一选择最需要检查的假设</h3><p>${esc(diagnosis(i,d))}</p><p>你在揭晓后记录的修正：${esc(d.reflection||'未记录')}</p><p>机会与代价：${o.tradeoff}</p></div>`}).join('')}<div class="panel"><h2>把这仗带回自己的城市</h2><p>${E.transfer}</p><p class="muted">${E.debrief}</p><button onclick="downloadReview()">下载完整教练复盘包</button> <button onclick="finish()">归档战报</button></div><details><summary>史料档案 · 已解锁</summary>${E.sources.map(x=>`<p>[${x.id}] ${x.date} <a href="${x.url}" target="_blank" rel="noopener">${x.title}</a></p>`).join('')}<p>未证实并排除：14个月跑道、10城补贴翻倍、当年某核心城市独家买断。2013份额“过半”涉及具体月份与不同口径，本集不使用该数。</p></details>`}
function downloadReview(){let text='# STR-0001 教练复盘包\n请严评我的决策依据、停止条件和资源取舍。不要因为与历史路线不同就扣分，不用后来结果证明当年必然正确。最后只留一个改进动作。两项预测Brier只算本局表现，不算稳定校准。\n'+JSON.stringify({episode:E,run:state.active},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download='STR-0001-复盘包.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function finish(){if(!state.runs.some(r=>r.id===state.active.id))state.runs.push({...state.active,finishedAt:new Date().toISOString()});state.active=null;save();home()}
home();
</script></html>
